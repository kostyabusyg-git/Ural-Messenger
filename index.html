<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ural Messenger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .app {
    width: 100%; max-width: 420px; height: 92vh; background: #fff;
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .header {
    background: #517da2; color: #fff; padding: 16px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
  }
  .status { font-size: 11px; opacity: 0.8; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; transition: background .3s; }
  .dot.offline { background: #f44336; }
  .chat-box {
    flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column;
    gap: 8px; background: #e6ebee;
  }
  .message {
    max-width: 80%; padding: 8px 12px; border-radius: 12px; background: #fff;
    align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    font-size: 14px; word-break: break-word; animation: pop .2s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  .message.my { background: #effdde; align-self: flex-end; }
  .message .user { font-size: 11px; color: #517da2; font-weight: 600; margin-bottom: 3px; }
  .message .time { font-size: 10px; color: #999; text-align: right; margin-top: 3px; }
  .input-area { display: flex; padding: 10px; background: #fff; border-top: 1px solid #eee; gap: 8px; }
  input {
    flex: 1; padding: 11px 16px; border: 1px solid #ddd; border-radius: 22px;
    outline: none; font-size: 14px; transition: border-color .2s;
  }
  input:focus { border-color: #517da2; }
  button {
    background: #517da2; color: #fff; border: none; padding: 0 20px;
    border-radius: 22px; cursor: pointer; font-weight: 600; transition: background .2s;
  }
  button:hover { background: #3e6282; }
  button:disabled { background: #b0bec5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <span>Ural Messenger</span>
      <div class="status"><span class="dot" id="dot"></span><span id="status-text">Подключение...</span></div>
    </div>
    <div class="chat-box" id="messages-container"></div>
    <div class="input-area">
      <input type="text" id="message-input" placeholder="Написать сообщение..." autocomplete="off" maxlength="1000">
      <button id="send-btn">Отпр.</button>
    </div>
  </div>

<script>
  // --- НАСТРОЙКИ ---
  const SUPABASE_URL = 'https://mlmydwdpffkvopnephxb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sbXlkd2RwZmZrdm9wbmVwaHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDE5MzAsImV4cCI6MjEwNzg3NzkzMH0.CfBxElG-GYV7OCeMLJmzaAcQYWxu_nAglZGhGFd5hzA';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let username = prompt("Введи свое имя:", "") || "Гость";
  username = username.trim().slice(0, 30) || "Гость";

  const container = document.getElementById('messages-container');
  const input = document.getElementById('message-input');
  const btn = document.getElementById('send-btn');
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('status-text');

  // --- УТИЛИТЫ ---
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }
  function scrollToBottom() {
    container.scrollTop = container.scrollHeight;
  }

  // --- ДОБАВЛЕНИЕ НА ЭКРАН ---
  function addMessageToUI(msg) {
    const div = document.createElement('div');
    div.classList.add('message');
    if (msg.username === username) div.classList.add('my');
    div.innerHTML = `
      <div class="user">${escapeHtml(msg.username)}</div>
      <div>${escapeHtml(msg.content)}</div>
      <div class="time">${formatTime(msg.created_at)}</div>
    `;
    container.appendChild(div);
    scrollToBottom();
  }

  // --- ЗАГРУЗКА ---
  async function loadMessages() {
    const { data, error } = await supabase
      .from('messages')
      .select('*')
      .order('created_at', { ascending: true })
      .limit(100);
    if (error) {
      console.error('Ошибка загрузки:', error);
      statusText.textContent = 'Ошибка БД';
      dot.classList.add('offline');
      return;
    }
    container.innerHTML = '';
    data.forEach(addMessageToUI);
  }

  // --- ОТПРАВКА ---
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    btn.disabled = true;

    const { error } = await supabase
      .from('messages')
      .insert([{ content: text, username: username }]);

    btn.disabled = false;
    if (error) {
      console.error('Ошибка отправки:', error);
      alert('Сообщение не отправлено: ' + error.message);
      input.value = text; // вернём текст
    }
  }

  // --- REALTIME ---
  function setupRealtime() {
    supabase.channel('public:messages')
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'messages' },
        payload => {
          if (payload.new.username !== username) addMessageToUI(payload.new);
        }
      )
      .subscribe(status => {
        if (status === 'SUBSCRIBED') {
          dot.classList.remove('offline');
          statusText.textContent = 'онлайн';
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          dot.classList.add('offline');
          statusText.textContent = 'оффлайн';
        }
      });
  }

  // --- СОБЫТИЯ ---
  btn.addEventListener('click', sendMessage);
  input.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
  // Переподключение при возврате вкладки
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadMessages();
  });

  // --- СТАРТ ---
  loadMessages();
  setupRealtime();
</script>
</body>
    </html>

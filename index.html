<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ural Messenger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2aabee">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --accent: #2aabee;
    --bg-app: #17212b; --bg-header: #1c2733; --bg-input: #242f3d; --bg-input-focus: #2b3a4a;
    --bg-msg-other: #182533; --bg-msg-self: #2b5278; --bg-card: #1c2733;
    --text: #f5f5f5; --text-muted: #7d8b99; --text-msg-other: #e1e1e1; --text-msg-self: #fff;
    --border: #101921; --name-color: #6ab3f3; --scroll-thumb: #2b3a4a;
    --ripple: rgba(255,255,255,0.25);
  }
  [data-theme="light"] {
    --bg-app: #fff; --bg-header: #f0f2f5; --bg-input: #f0f2f5; --bg-input-focus: #e4e6eb;
    --bg-msg-other: #f0f2f5; --bg-msg-self: #dcf8c6; --bg-card: #fff;
    --text: #111; --text-muted: #707579; --text-msg-other: #111; --text-msg-self: #111;
    --border: #e4e6eb; --name-color: #2aabee; --scroll-thumb: #c4c9cc;
    --ripple: rgba(0,0,0,0.12);
  }
  [data-theme="dark-blue"] {
    --bg-app: #0f1b2b; --bg-header: #142236; --bg-input: #1b2c42; --bg-input-focus: #22374f;
    --bg-msg-other: #182a40; --bg-msg-self: #27507a; --bg-card: #142236;
    --text: #e8f0f8; --text-muted: #7d90a8; --text-msg-other: #dce6f0; --text-msg-self: #fff;
    --border: #0a1420; --name-color: #5cb8f0; --scroll-thumb: #22374f;
  }
  [data-theme="dark-purple"] {
    --bg-app: #1a1426; --bg-header: #211a30; --bg-input: #2a2140; --bg-input-focus: #352a52;
    --bg-msg-other: #241c38; --bg-msg-self: #5c3d99; --bg-card: #211a30;
    --text: #f0e8ff; --text-muted: #9b8db5; --text-msg-other: #e8dffa; --text-msg-self: #fff;
    --border: #120d1c; --name-color: #b794f6; --scroll-thumb: #352a52;
  }
  [data-theme="dark-green"] {
    --bg-app: #0f1f18; --bg-header: #142a20; --bg-input: #1b3628; --bg-input-focus: #224432;
    --bg-msg-other: #182d22; --bg-msg-self: #2d6a4f; --bg-card: #142a20;
    --text: #e8f5ee; --text-muted: #7da890; --text-msg-other: #dcefe3; --text-msg-self: #fff;
    --border: #0a1710; --name-color: #52c48a; --scroll-thumb: #224432;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-app); transition: background .3s; }
  #app { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: var(--bg-app); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,.5); transition: background .3s; }
  @media (min-width: 481px) { #app { top: 20px; bottom: 20px; border-radius: 12px; } }
  .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .hidden { display: none !important; }

  /* ===== Анимации ===== */
  @keyframes screenIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  @keyframes screenOut { to { opacity: 0; transform: translateX(-20px); } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(42,171,238,.5)} 100%{box-shadow:0 0 0 12px rgba(42,171,238,0)} }
  @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
  @keyframes avatarIn { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }

  .screen-anim { animation: screenIn .28s cubic-bezier(.21,1.02,.73,1); }
  .screen-anim-out { animation: screenOut .22s ease-in; }

  /* Auth */
  #auth-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 30px; overflow-y: auto; }
  #auth-screen .logo { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #229ed9); display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; animation: float 3s ease-in-out infinite, popIn .4s cubic-bezier(.21,1.02,.73,1); }
  #auth-screen .logo .icon { width: 40px; height: 40px; stroke-width: 2.5; }
  #auth-screen h2 { color: var(--text); font-weight: 500; font-size: 20px; }
  #auth-screen input { width: 100%; max-width: 280px; padding: 12px 18px; border: 1px solid var(--bg-input); border-radius: 24px; background: var(--bg-input); color: var(--text); font-size: 15px; outline: none; text-align: center; transition: border-color .2s, box-shadow .2s, background .2s, transform .15s; }
  #auth-screen input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,171,238,.15); transform: scale(1.02); }
  .auth-tabs { display: flex; gap: 8px; }
  .auth-tab { padding: 8px 20px; border: none; border-radius: 20px; background: var(--bg-input); color: var(--text-muted); font-size: 14px; cursor: pointer; transition: background .2s, color .2s, transform .15s; }
  .auth-tab.active { background: var(--accent); color: white; }
  .auth-tab:active { transform: scale(.95); }
  .auth-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
  .auth-form button { padding: 12px 40px; border: none; border-radius: 24px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform .15s, filter .2s; position: relative; overflow: hidden; }
  .auth-form button:active { transform: scale(.96); }
  #auth-error { color: #e74c3c; font-size: 13px; min-height: 18px; text-align: center; animation: fadeIn .2s; }

  /* Ripple */
  .ripple-btn { position: relative; overflow: hidden; }
  .ripple-btn::after { content: ''; position: absolute; border-radius: 50%; background: var(--ripple); transform: scale(0); opacity: 0; pointer-events: none; }
  .ripple-btn.rippling::after { animation: rippleAnim .6s ease-out; }
  @keyframes rippleAnim { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }

  /* List */
  #list-screen { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  #list-header { padding: 14px 18px; background: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .avatar { border-radius: 50%; background: linear-gradient(135deg, var(--accent), #229ed9); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; font-weight: 600; flex-shrink: 0; overflow: hidden; animation: avatarIn .3s cubic-bezier(.21,1.02,.73,1); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  #list-header .avatar { width: 38px; height: 38px; }
  #list-header .info { flex: 1; min-width: 0; color: var(--text); }
  #list-header .info .name { font-weight: 600; font-size: 15px; }
  #list-header .info .status { font-size: 12px; color: var(--text-muted); }
  .icon-btn { background: none; border: none; color: var(--text-muted); padding: 6px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, color .2s, transform .15s; flex-shrink: 0; }
  .icon-btn:hover { background: var(--bg-input); color: var(--text); }
  .icon-btn:active { transform: scale(.9); }

  #search-bar { padding: 8px 18px; background: var(--bg-header); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #search-bar input { width: 100%; padding: 9px 14px; border: none; border-radius: 18px; background: var(--bg-input); color: var(--text); font-size: 14px; outline: none; transition: background .2s, box-shadow .2s; }
  #search-bar input:focus { background: var(--bg-input-focus); box-shadow: 0 0 0 2px var(--accent); }

  #chats { flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #chats::-webkit-scrollbar { width: 4px; }
  #chats::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
  .chat-item { padding: 12px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .15s, transform .12s; animation: fadeIn .25s ease-out backwards; position: relative; overflow: hidden; }
  .chat-item:hover { background: var(--bg-input); }
  .chat-item:active { transform: scale(.98); }
  .chat-item .chat-avatar { width: 46px; height: 46px; }
  .chat-item .chat-info { flex: 1; min-width: 0; }
  .chat-item .chat-name { color: var(--text); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .chat-sub { color: var(--text-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px; animation: fadeIn .4s; }

  /* Skeleton */
  .skeleton { background: linear-gradient(90deg, var(--bg-input) 0%, var(--bg-input-focus) 50%, var(--bg-input) 100%); background-size: 400px 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
  .skeleton-item { padding: 12px 18px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--border); }
  .skeleton-avatar { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; }
  .skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skeleton-line { height: 12px; border-radius: 6px; }
  .skeleton-line.short { width: 60%; }

  /* Chat */
  #chat-screen { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  #header { padding: 12px 14px; background: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; z-index: 2; }
  #back-btn { background: none; border: none; color: var(--text-muted); padding: 6px; border-radius: 50%; cursor: pointer; display: flex; transition: background .2s, transform .15s; }
  #back-btn:hover { background: var(--bg-input); color: var(--text); }
  #back-btn:active { transform: scale(.9); }
  #header .avatar { width: 36px; height: 36px; }
  #header .info { color: var(--text); flex: 1; min-width: 0; }
  #header .info .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #header .info .status { font-size: 12px; color: var(--text-muted); word-break: break-word; }
  #messages { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; flex-shrink: 0; animation: msgIn .35s cubic-bezier(.21,1.02,.73,1) forwards; opacity: 0; transform: translateY(12px) scale(.97); }
  .msg.self { align-self: flex-end; background: var(--bg-msg-self); color: var(--text-msg-self); border-bottom-right-radius: 4px; }
  .msg.other { align-self: flex-start; background: var(--bg-msg-other); color: var(--text-msg-other); border-bottom-left-radius: 4px; }
  .msg .name { font-size: 11px; font-weight: 600; color: var(--name-color); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
  .msg .name .mini-avatar { width: 18px; height: 18px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, var(--accent), #229ed9); display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; font-weight: 700; flex-shrink: 0; }
  .msg .name .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg .time { font-size: 10px; color: var(--text-muted); float: right; margin-left: 8px; margin-top: 4px; }
  .msg img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 6px; display: block; cursor: pointer; }
  .msg.new-pulse { animation: msgIn .35s cubic-bezier(.21,1.02,.73,1) forwards, pulse 1.2s ease-out; }
  #input-area { padding: 12px 16px; background: var(--bg-header); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  #attach { width: 38px; height: 38px; border: none; border-radius: 50%; background: var(--bg-input); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, transform .15s; }
  #attach:hover { background: var(--bg-input-focus); color: var(--text); }
  #attach:active { transform: scale(.9); }
  #attach:disabled { opacity: .5; cursor: not-allowed; }
  #input { flex: 1; padding: 10px 16px; border: none; border-radius: 20px; background: var(--bg-input); color: var(--text); font-size: 14px; outline: none; min-width: 0; transition: background .2s; }
  #input:focus { background: var(--bg-input-focus); }
  #input::placeholder { color: var(--text-muted); }
  #send { width: 42px; height: 42px; border: none; border-radius: 50%; background: var(--accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .15s; }
  #send:active { transform: scale(.9); }
  #send:disabled { background: var(--bg-input-focus); color: var(--text-muted); cursor: not-allowed; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; justify-content: center; align-items: center; z-index: 100; animation: fadeIn .2s; padding: 20px; }
  .panel { background: var(--bg-card); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; color: var(--text); animation: popIn .25s cubic-bezier(.21,1.02,.73,1); max-height: 90vh; overflow-y: auto; }
  .panel h3 { margin-bottom: 16px; font-weight: 600; }
  .panel input, .panel textarea { width: 100%; padding: 12px 16px; border: none; border-radius: 12px; background: var(--bg-input); color: var(--text); font-size: 14px; outline: none; margin-bottom: 10px; resize: none; }
  .panel input:focus, .panel textarea:focus { background: var(--bg-input-focus); box-shadow: 0 0 0 2px var(--accent); }
  .panel .btn-primary { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: transform .15s; }
  .panel .btn-primary:active { transform: scale(.97); }
  .panel .btn-secondary { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--bg-input); color: var(--text); font-size: 14px; cursor: pointer; margin-top: 8px; transition: background .2s, transform .15s; }
  .panel .btn-secondary:active { transform: scale(.97); }
  .panel .err { color: #e74c3c; font-size: 13px; min-height: 18px; margin-top: 4px; }
  .panel label.check { display: flex; align-items: center; gap: 10px; font-size: 14px; margin: 6px 0 12px; cursor: pointer; color: var(--text); }
  .panel label.check input { width: auto; margin: 0; }

  .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--bg-input); }
  .setting-row:last-of-type { border-bottom: none; }
  .setting-row label { font-size: 14px; }
  .toggle { width: 46px; height: 26px; border-radius: 13px; background: var(--bg-input-focus); border: none; cursor: pointer; position: relative; transition: background .25s; flex-shrink: 0; }
  .toggle.on { background: var(--accent); }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .25s cubic-bezier(.21,1.02,.73,1); }
  .toggle.on::after { transform: translateX(20px); }
  .themes { display: flex; gap: 8px; flex-wrap: wrap; }
  .themes button { width: 36px; height: 36px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; position: relative; overflow: hidden; transition: transform .15s; }
  .themes button::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--preview-bg) 50%, var(--preview-accent) 50%); }
  .themes button.active { border-color: var(--accent); }
  .themes button:active { transform: scale(.9); }
  .menu-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .menu-item { padding: 14px; border-radius: 12px; background: var(--bg-input); color: var(--text); cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: background .2s, transform .12s; }
  .menu-item:hover { background: var(--bg-input-focus); }
  .menu-item:active { transform: scale(.98); }

  /* Settings avatar */
  .settings-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 12px; }
  .settings-avatar { width: 80px; height: 80px; font-size: 28px; cursor: pointer; transition: transform .2s; }
  .settings-avatar:hover { transform: scale(1.05); }

  /* Search results */
  .search-section-title { padding: 10px 18px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); font-weight: 700; }
  .search-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--accent); color: #fff; margin-left: 6px; font-weight: 600; }
</style>
</head>
<body>

<div id="app">
  <!-- AUTH -->
  <div id="auth-screen">
    <div class="logo">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </div>
    <h2>Ural Messenger</h2>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Войти</button>
      <button class="auth-tab" id="tab-create">Регистрация</button>
    </div>
    <div class="auth-form" id="form-login">
      <input type="tel" id="login-phone" placeholder="Номер телефона" maxlength="20">
      <input type="password" id="login-password" placeholder="Пароль" maxlength="50">
      <button id="login-btn" class="ripple-btn">Войти</button>
    </div>
    <div class="auth-form hidden" id="form-create">
      <input type="text" id="create-name" placeholder="Ваше имя" maxlength="20">
      <input type="tel" id="create-phone" placeholder="Номер телефона" maxlength="20">
      <input type="password" id="create-password" placeholder="Придумайте пароль" maxlength="50">
      <button id="create-btn" class="ripple-btn">Создать аккаунт</button>
    </div>
    <div id="auth-error"></div>
  </div>

  <!-- LIST -->
  <div id="list-screen" class="hidden">
    <div id="list-header">
      <div class="avatar" id="me-avatar">?</div>
      <div class="info">
        <div class="name" id="me-name">Пользователь</div>
        <div class="status" id="me-status">Список чатов</div>
      </div>
      <button class="icon-btn" id="settings-btn" title="Настройки">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="new-chat-btn" title="Новый чат">
        <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div id="search-bar">
      <input type="text" id="search-input" placeholder="Поиск групп и людей...">
    </div>
    <div id="chats"></div>
  </div>

  <!-- CHAT -->
  <div id="chat-screen" class="hidden">
    <div id="header">
      <button id="back-btn">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="avatar" id="chat-avatar">?</div>
      <div class="info">
        <div class="name" id="chat-title">Чат</div>
        <div class="status" id="chat-status">Подключение...</div>
      </div>

      </button>

      <input type="text" id="input" placeholder="Написать сообщение..." disabled>
      <button id="send" disabled>
        <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module">
  const SUPABASE_URL = 'https://mlmydwdpffkvopnephxb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sbXlkd2RwZmZrdm9wbmVwaHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDE5MzAsImV4cCI6MjEwNzg3NzkzMH0.CfBxElG-GYV7OCeMLJmzaAcQYWxu_nAglZGhGFd5hzA';
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // DOM
  const authScreen = document.getElementById('auth-screen');
  const listScreen = document.getElementById('list-screen');
  const chatScreen = document.getElementById('chat-screen');
  const chatsEl = document.getElementById('chats');
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const chatStatusEl = document.getElementById('chat-status');
  const chatTitleEl = document.getElementById('chat-title');
  const chatAvatarEl = document.getElementById('chat-avatar');
  const searchInput = document.getElementById('search-input');

  let myName = '', myPhone = '', myAvatar = '';
  let currentChatId = null, currentChatType = null;
  let channel = null, isSending = false;
  const renderedIds = new Set();
  const userAvatarCache = {};
  let searchTimeout = null;

  const settings = {
    sound: localStorage.getItem('chat_sound') !== 'off',
    theme: localStorage.getItem('chat_theme') || 'dark',
    accent: localStorage.getItem('chat_accent') || '#2aabee'
  };
  applyTheme();

  function applyTheme() {
    document.documentElement.setAttribute('data-theme', settings.theme);
    document.documentElement.style.setProperty('--accent', settings.accent);
  }

  // Ripple
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest('.ripple-btn');
    if (!t) return;
    const r = t.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    t.style.setProperty('--ripple-x', (e.clientX - r.left - size / 2) + 'px');
    t.style.setProperty('--ripple-y', (e.clientY - r.top - size / 2) + 'px');
    t.classList.remove('rippling'); void t.offsetWidth; t.classList.add('rippling');
  });
  // Переопределяем ::after позиционирование для ripple через inline style
  const styleRipple = document.createElement('style');
  styleRipple.textContent = `.ripple-btn::after { width: 100%; height: 100%; top: 0; left: 0; }`;
  document.head.appendChild(styleRipple);

  let audioCtx = null;
  function playPing() {
    if (!settings.sound) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + .15);
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.15, audioCtx.currentTime + .01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + .3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + .3);
    } catch (e) {}
  }

  function normalizePhone(p) { return p.replace(/[\s\-\(\)]/g, '').replace(/^8/, '+7'); }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
  function initials(name) { return (name || '?').trim().charAt(0).toUpperCase() || '?'; }
  function avatarHtml(name, url, size) {
    if (url) return `<div class="avatar" style="width:${size}px;height:${size}px;"><img src="${escapeHtml(url)}" alt=""></div>`;
    return `<div class="avatar" style="width:${size}px;height:${size}px;">${escapeHtml(initials(name))}</div>`;
  }

  // Tabs
  document.getElementById('tab-login').onclick = () => {
    document.getElementById('tab-login').classList.add('active');
    document.getElementById('tab-create').classList.remove('active');
    document.getElementById('form-login').classList.remove('hidden');
    document.getElementById('form-create').classList.add('hidden');
    document.getElementById('auth-error').textContent = '';
  };
  document.getElementById('tab-create').onclick = () => {
    document.getElementById('tab-create').classList.add('active');
    document.getElementById('tab-login').classList.remove('active');
    document.getElementById('form-create').classList.remove('hidden');
    document.getElementById('form-login').classList.add('hidden');
    document.getElementById('auth-error').textContent = '';
  };

  // Register
  document.getElementById('create-btn').onclick = async () => {
    const err = document.getElementById('auth-error');
    const name = document.getElementById('create-name').value.trim();
    const phone = normalizePhone(document.getElementById('create-phone').value.trim());
    const pass = document.getElementById('create-password').value.trim();
    if (!name || !phone || !pass) { err.textContent = 'Заполните все поля'; return; }
    if (phone.length < 10) { err.textContent = 'Некорректный номер'; return; }
    if (pass.length < 4) { err.textContent = 'Пароль минимум 4 символа'; return; }
    const { error } = await supabase.from('users').insert({ name, phone, password: pass });
    if (error) { err.textContent = error.code === '23505' ? 'Номер уже зарегистрирован' : error.message; return; }
    myName = name; myPhone = phone; myAvatar = '';
    localStorage.setItem('chat_name', myName); localStorage.setItem('chat_phone', myPhone);
    enterApp();
  };

  // Login
  document.getElementById('login-btn').onclick = async () => {
    const err = document.getElementById('auth-error');
    const phone = normalizePhone(document.getElementById('login-phone').value.trim());
    const pass = document.getElementById('login-password').value.trim();
    if (!phone || !pass) { err.textContent = 'Заполните все поля'; return; }
    const { data, error } = await supabase.from('users').select('name, password, avatar_url').eq('phone', phone).single();
    if (error || !data) { err.textContent = 'Пользователь не найден'; return; }
    if (data.password !== pass) { err.textContent = 'Неверный пароль'; return; }
    myName = data.name; myPhone = phone; myAvatar = data.avatar_url || '';
    localStorage.setItem('chat_name', myName); localStorage.setItem('chat_phone', myPhone);
    enterApp();
  };

  // Auto login
  window.addEventListener('DOMContentLoaded', async () => {
    const name = localStorage.getItem('chat_name'), phone = localStorage.getItem('chat_phone');
    if (name && phone) {
      const { data, error } = await supabase.from('users').select('name, avatar_url').eq('phone', phone).single();
      if (!error && data) { myName = data.name; myPhone = phone; myAvatar = data.avatar_url || ''; enterApp(); }
    }
  });

  async function enterApp() {
    authScreen.classList.add('hidden');
    listScreen.classList.remove('hidden');
    listScreen.classList.add('screen-anim');
    updateMeHeader();
    await loadChats();
  }

  function updateMeHeader() {
    const el = document.getElementById('me-avatar');
    el.outerHTML = avatarHtml(myName, myAvatar, 38).replace('class="avatar"', 'id="me-avatar" class="avatar"');
    document.getElementById('me-name').textContent = myName;
  }

  // Skeleton
  function showSkeleton() {
    chatsEl.innerHTML = Array.from({ length: 4 }).map(() => `
      <div class="skeleton-item">
        <div class="skeleton skeleton-avatar"></div>
        <div class="skeleton-lines">
          <div class="skeleton skeleton-line" style="width:70%"></div>
          <div class="skeleton skeleton-line short"></div>
        </div>
      </div>`).join('');
  }

  // Load chats
  async function loadChats() {
    showSkeleton();
    const { data: memberships, error: mErr } = await supabase
      .from('chat_members').select('chat_id').eq('user_phone', myPhone);
    if (mErr) { chatsEl.innerHTML = `<div id="list-empty">Ошибка: ${escapeHtml(mErr.message)}</div>`; return; }
    if (!memberships || !memberships.length) {
      chatsEl.innerHTML = '<div id="list-empty">Пока нет чатов.<br>Нажми «+» или найди группу в поиске.</div>';
      return;
    }
    const ids = memberships.map(m => m.chat_id);
    const { data: chats, error: cErr } = await supabase.from('chats').select('*').in('id', ids);
    if (cErr) { chatsEl.innerHTML = `<div id="list-empty">Ошибка: ${escapeHtml(cErr.message)}</div>`; return; }

    chatsEl.innerHTML = '';
    let i = 0;
    for (const c of chats) {
      let displayName = c.name, avatarUrl = '';
      if (c.type === 'direct') {
        const { data: others } = await supabase.from('chat_members')
          .select('user_phone').eq('chat_id', c.id).neq('user_phone', myPhone).limit(1);
        if (others && others[0]) {
          const { data: u } = await supabase.from('users').select('name, avatar_url').eq('phone', others[0].user_phone).single();
          displayName = u ? u.name : others[0].user_phone;
          avatarUrl = u ? u.avatar_url : '';
        } else displayName = 'Личный чат';
      }
      const div = document.createElement('div');
      div.className = 'chat-item';
      div.style.animationDelay = (i * 30) + 'ms';
      i++;
      div.innerHTML = `
        ${avatarHtml(displayName, avatarUrl, 46).replace('class="avatar"', 'class="avatar chat-avatar"')}
        <div class="chat-info">
          <div class="chat-name">${escapeHtml(displayName || 'Без названия')}${c.is_public ? '<span class="search-badge">PUB</span>' : ''}</div>
          <div class="chat-sub">${c.type === 'group' ? (c.is_public ? 'Публичная группа' : 'Группа') : 'Личный чат'}</div>
        </div>`;
      div.onclick = () => openChat(c.id, displayName || 'Чат', c.type, avatarUrl);
      chatsEl.appendChild(div);
    }
  }

  // Search
  searchInput.oninput = () => {
    clearTimeout(searchTimeout);
    const q = searchInput.value.trim();
    if (!q) { loadChats(); return; }
    searchTimeout = setTimeout(() => doSearch(q), 300);
  };

  async function doSearch(q) {
    showSkeleton();
    const like = '%' + q.replace(/[%_]/g, '') + '%';
    const [groupsRes, usersRes] = await Promise.all([
      supabase.from('chats').select('*').eq('is_public', true).or(`name.ilike.${like},description.ilike.${like}`).limit(20),
      supabase.from('users').select('name, phone, avatar_url').or(`name.ilike.${like},phone.ilike.${like}`).neq('phone', myPhone).limit(20)
    ]);

    chatsEl.innerHTML = '';
    const groups = groupsRes.data || [];
    const users = usersRes.data || [];

    if (!groups.length && !users.length) {
      chatsEl.innerHTML = '<div id="list-empty">Ничего не найдено</div>';
      return;
    }

    if (groups.length) {
      const t = document.createElement('div');
      t.className = 'search-section-title';
      t.textContent = 'Публичные группы';
      chatsEl.appendChild(t);
      groups.forEach((c, i) => {
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.style.animationDelay = (i * 30) + 'ms';
        div.innerHTML = `
          ${avatarHtml(c.name, '', 46).replace('class="avatar"', 'class="avatar chat-avatar"')}
          <div class="chat-info">
            <div class="chat-name">${escapeHtml(c.name)}</div>
            <div class="chat-sub">${escapeHtml(c.description || 'Публичная группа')}</div>
          </div>`;
        div.onclick = () => joinPublicChat(c);
        chatsEl.appendChild(div);
      });
    }
    if (users.length) {
      const t = document.createElement('div');
      t.className = 'search-section-title';
      t.textContent = 'Пользователи';
      chatsEl.appendChild(t);
      users.forEach((u, i) => {
        const div = document.createElement('div');
        div.className = 'chat-item';
        div.style.animationDelay = (i * 30) + 'ms';
        div.innerHTML = `
          ${avatarHtml(u.name, u.avatar_url, 46).replace('class="avatar"', 'class="avatar chat-avatar"')}
          <div class="chat-info">
            <div class="chat-name">${escapeHtml(u.name)}</div>
            <div class="chat-sub">${escapeHtml(u.phone)}</div>
          </div>`;
        div.onclick = () => startDirect(u.phone);
        chatsEl.appendChild(div);
      });
    }
  }

  async function joinPublicChat(chat) {
    const { data: exists } = await supabase.from('chat_members').select('id')
      .eq('chat_id', chat.id).eq('user_phone', myPhone).limit(1);
    if (!exists || !exists.length) {
      await supabase.from('chat_members').insert({ chat_id: chat.id, user_phone: myPhone });
    }
    searchInput.value = '';
    await loadChats();
    openChat(chat.id, chat.name || 'Группа', 'group', '');
  }

  async function startDirect(phone) {
    // Проверим, нет ли уже direct
    const { data: myChats } = await supabase.from('chat_members').select('chat_id').eq('user_phone', myPhone);
    if (myChats) {
      for (const m of myChats) {
        const { data: chat } = await supabase.from('chats').select('type').eq('id', m.chat_id).single();
        if (chat && chat.type === 'direct') {
          const { data: other } = await supabase.from('chat_members').select('user_phone')
            .eq('chat_id', m.chat_id).eq('user_phone', phone).limit(1);
          if (other && other.length) {
            searchInput.value = '';
            await loadChats();
            return;
          }
        }
      }
    }
    const { data: chat, error } = await supabase.from('chats').insert({ type: 'direct', created_by: myPhone }).select().single();
    if (error) return;
    await supabase.from('chat_members').insert([
      { chat_id: chat.id, user_phone: myPhone },
      { chat_id: chat.id, user_phone: phone }
    ]);
    searchInput.value = '';
    await loadChats();
  }

  // Open chat
  async function openChat(chatId, title, type, avatarUrl) {
    currentChatId = chatId; currentChatType = type;
    renderedIds.clear();
    messagesEl.innerHTML = '';
    chatTitleEl.textContent = title;
    chatAvatarEl.outerHTML = avatarHtml(title, avatarUrl, 36).replace('class="avatar"', 'id="chat-avatar" class="avatar"');
    chatStatusEl.textContent = 'Загрузка...';
    listScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
    chatScreen.classList.add('screen-anim');
    inputEl.disabled = true; sendBtn.disabled = true;

    const { data: history, error } = await supabase
      .from('messages').select('*').eq('chat_id', chatId)
      .order('created_at', { ascending: true }).limit(100);
    if (error) chatStatusEl.textContent = 'История: ' + error.message;
    else if (history) history.forEach(m => {
      if (!renderedIds.has(m.id)) {
        renderedIds.add(m.id);
        addMessage(m.user_name, m.text, m.user_name === myName, m.created_at, m.image_url, false);
      }
    });

    if (channel) { supabase.removeChannel(channel); channel = null; }
    channel = supabase.channel('chat-' + chatId)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}`
      }, payload => {
        const m = payload.new;
        if (renderedIds.has(m.id)) return;
        renderedIds.add(m.id);
        addMessage(m.user_name, m.text, m.user_name === myName, m.created_at, m.image_url, true);
        if (m.user_name !== myName) playPing();
      })
      .subscribe(status => {
        if (status === 'SUBSCRIBED') {
          chatStatusEl.textContent = type === 'group' ? 'Группа' : 'Личный чат';
          inputEl.disabled = false; sendBtn.disabled = false; inputEl.focus();
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          chatStatusEl.textContent = 'Переподключение...';
        }
      });

    if (!sendBtn.dataset.bound) {
      sendBtn.dataset.bound = '1';
      sendBtn.onclick = sendMessage;
      inputEl.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
      document.getElementById('attach').onclick = () => { if (!isSending) document.getElementById('file-input').click(); };
      document.getElementById('file-input').onchange = handleFileUpload;
    }
  }

  document.getElementById('back-btn').onclick = () => {
    if (channel) { supabase.removeChannel(channel); channel = null; }
    currentChatId = null;
    chatScreen.classList.add('hidden');
    listScreen.classList.remove('hidden');
    listScreen.classList.add('screen-anim');
    loadChats();
  };

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isSending || !currentChatId) return;
    isSending = true; sendBtn.disabled = true; inputEl.value = '';
    const { error } = await supabase.from('messages').insert({
      user_name: myName, text, image_url: null, chat_id: currentChatId
    });
    if (error) { chatStatusEl.textContent = 'Отправка: ' + error.message; inputEl.value = text; }
    isSending = false; sendBtn.disabled = false; inputEl.focus();
  }

  async function handleFileUpload() {
    const fileInput = document.getElementById('file-input');
    const file = fileInput.files[0]; fileInput.value = '';
    if (!file || isSending || !currentChatId) return;
    if (!file.type.startsWith('image/')) { chatStatusEl.textContent = 'Не изображение'; return; }
    if (file.size > 5 * 1024 * 1024) { chatStatusEl.textContent = 'Файл больше 5 МБ'; return; }
    isSending = true; sendBtn.disabled = true;
    chatStatusEl.textContent = 'Загрузка фото...';
    try {
      const ext = file.name.split('.').pop() || 'jpg';
      const path = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error: upErr } = await supabase.storage.from('chat-images')
        .upload(path, file, { contentType: file.type, cacheControl: '3600' });
      if (upErr) { chatStatusEl.textContent = 'Фото: ' + upErr.message; return; }
      const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
      const { error: insErr } = await supabase.from('messages').insert({
        user_name: myName, text: '', image_url: urlData.publicUrl, chat_id: currentChatId
      });
      if (insErr) chatStatusEl.textContent = 'Фото: ' + insErr.message;
      else chatStatusEl.textContent = currentChatType === 'group' ? 'Группа' : 'Личный чат';
    } finally { isSending = false; sendBtn.disabled = false; inputEl.focus(); }
  }

  async function getUserAvatar(phone) {
    if (userAvatarCache[phone] !== undefined) return userAvatarCache[phone];
    const { data } = await supabase.from('users').select('avatar_url').eq('phone', phone).single();
    const url = data ? data.avatar_url : '';
    userAvatarCache[phone] = url;
    return url;
  }

  function addMessage(name, text, isSelf, createdAt, imageUrl, isNew) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isSelf ? 'self' : 'other') + (isNew ? ' new-pulse' : '');
    const time = createdAt ? new Date(createdAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    const nameHtml = !isSelf ? `<div class="name"><span class="mini-avatar">${escapeHtml(initials(name))}</span>${escapeHtml(name)}</div>` : '';
    const textHtml = text ? escapeHtml(text) : '';
    const imgHtml = imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="фото" loading="lazy">` : '';
    div.innerHTML = `${nameHtml}${textHtml}${imgHtml}<span class="time">${time}</span>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // New chat modal
  document.getElementById('new-chat-btn').onclick = () => {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="panel">
        <h3>Новый чат</h3>
        <div class="menu-list">
          <div class="menu-item" id="menu-group">Создать группу</div>
          <div class="menu-item" id="menu-friend">Добавить друга по номеру</div>
        </div>
        <button class="btn-secondary" id="menu-cancel" style="margin-top:16px;">Отмена</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    document.getElementById('menu-cancel').onclick = () => overlay.remove();
    document.getElementById('menu-group').onclick = () => { overlay.remove(); showCreateGroup(); };
    document.getElementById('menu-friend').onclick = () => { overlay.remove(); showAddFriend(); };
  };

  function showCreateGroup() {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="panel">
        <h3>Создать группу</h3>
        <input type="text" id="grp-name" placeholder="Название группы" maxlength="40">
        <textarea id="grp-desc" placeholder="Описание (для поиска)" rows="2"></textarea>
        <label class="check"><input type="checkbox" id="grp-public"> Публичная (видна в поиске)</label>
        <input type="text" id="grp-members" placeholder="Номера через запятую (необязательно)">
        <div class="err" id="grp-err"></div>
        <button class="btn-primary" id="grp-create">Создать</button>
        <button class="btn-secondary" id="grp-cancel">Отмена</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    document.getElementById('grp-cancel').onclick = () => overlay.remove();
    document.getElementById('grp-create').onclick = async () => {
      const err = document.getElementById('grp-err');
      const name = document.getElementById('grp-name').value.trim();
      const desc = document.getElementById('grp-desc').value.trim();
      const isPublic = document.getElementById('grp-public').checked;
      if (!name) { err.textContent = 'Введите название'; return; }
      const membersRaw = document.getElementById('grp-members').value.split(',').map(s => normalizePhone(s.trim())).filter(Boolean);
      const { data: chat, error } = await supabase.from('chats').insert({
        type: 'group', name, description: desc || null, is_public: isPublic, created_by: myPhone
      }).select().single();
      if (error) { err.textContent = error.message; return; }
      await supabase.from('chat_members').insert({ chat_id: chat.id, user_phone: myPhone });
      for (const phone of membersRaw) {
        if (phone === myPhone) continue;
        const { data: u } = await supabase.from('users').select('phone').eq('phone', phone).single();
        if (u) await supabase.from('chat_members').insert({ chat_id: chat.id, user_phone: phone });
      }
      overlay.remove();
      await loadChats();
    };
  }

  function showAddFriend() {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="panel">
        <h3>Добавить друга</h3>
        <input type="tel" id="fr-phone" placeholder="Номер телефона друга">
        <div class="err" id="fr-err"></div>
        <button class="btn-primary" id="fr-add">Найти и создать чат</button>
        <button class="btn-secondary" id="fr-cancel">Отмена</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    document.getElementById('fr-cancel').onclick = () => overlay.remove();
    document.getElementById('fr-add').onclick = async () => {
      const err = document.getElementById('fr-err');
      const phone = normalizePhone(document.getElementById('fr-phone').value.trim());
      if (!phone) { err.textContent = 'Введите номер'; return; }
      if (phone === myPhone) { err.textContent = 'Это ваш номер'; return; }
      const { data: user } = await supabase.from('users').select('name').eq('phone', phone).single();
      if (!user) { err.textContent = 'Пользователь не найден'; return; }
      overlay.remove();
      await startDirect(phone);
    };
  }

  // Settings
  document.getElementById('settings-btn').onclick = () => {
    const THEMES = [
      { id: 'dark', name: 'Тёмная', bg: '#17212b', accent: '#2aabee' },
      { id: 'light', name: 'Светлая', bg: '#ffffff', accent: '#2aabee' },
      { id: 'dark-blue', name: 'Синяя', bg: '#0f1b2b', accent: '#2aabee' },
      { id: 'dark-purple', name: 'Фиолет', bg: '#1a1426', accent: '#9b59b6' },
      { id: 'dark-green', name: 'Зелёная', bg: '#0f1f18', accent: '#2ecc71' }
    ];
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="panel">
        <h3>Настройки</h3>
        <div class="settings-avatar-wrap">
          ${avatarHtml(myName, myAvatar, 80).replace('class="avatar"', 'class="avatar settings-avatar ripple-btn" id="settings-avatar"')}
          <button class="btn-secondary" id="change-avatar" style="width:auto;padding:8px 16px;margin:0;">Сменить аватар</button>
          <input type="file" id="avatar-input" accept="image/*" hidden>
        </div>
        <div class="setting-row"><label>Звук</label><button class="toggle ${settings.sound ? 'on' : ''}" id="t-sound"></button></div>
        <div class="setting-row" style="flex-direction:column;align-items:flex-start;gap:10px;">
          <label>Тема</label>
          <div class="themes" id="t-themes">${THEMES.map(t => `<button data-id="${t.id}" class="${settings.theme === t.id ? 'active' : ''}" style="--preview-bg:${t.bg};--preview-accent:${t.accent};"></button>`).join('')}</div>
        </div>
        <div class="setting-row" style="flex-direction:column;align-items:flex-start;gap:10px;">
          <label>Акцент</label>
          <div class="themes" id="t-accents">${['#2aabee','#e74c3c','#2ecc71','#9b59b6','#f39c12'].map(a => `<button data-accent="${a}" class="${settings.accent === a ? 'active' : ''}" style="--preview-bg:${a};--preview-accent:${a};"></button>`).join('')}</div>
        </div>
        <button class="btn-secondary" id="t-logout" style="margin-top:14px;">Выйти из аккаунта</button>
        <button class="btn-secondary" id="t-close">Закрыть</button>
      </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    document.getElementById('t-close').onclick = () => overlay.remove();
    document.getElementById('t-sound').onclick = e => {
      settings.sound = !settings.sound;
      localStorage.setItem('chat_sound', settings.sound ? 'on' : 'off');
      e.target.classList.toggle('on', settings.sound);
      if (settings.sound) playPing();
    };
    overlay.querySelectorAll('#t-themes button').forEach(b => b.onclick = () => {
      settings.theme = b.dataset.id; localStorage.setItem('chat_theme', settings.theme);
      applyTheme(); overlay.querySelectorAll('#t-themes button').forEach(x => x.classList.remove('active')); b.classList.add('active');
    });
    overlay.querySelectorAll('#t-accents button').forEach(b => b.onclick = () => {
      settings.accent = b.dataset.accent; localStorage.setItem('chat_accent', settings.accent);
      applyTheme(); overlay.querySelectorAll('#t-accents button').forEach(x => x.classList.remove('active')); b.classList.add('active');
    });
    document.getElementById('t-logout').onclick = () => {
      localStorage.removeItem('chat_name'); localStorage.removeItem('chat_phone');
      location.reload();
    };
    const avatarInput = document.getElementById('avatar-input');
    document.getElementById('change-avatar').onclick = () => avatarInput.click();
    document.getElementById('settings-avatar').onclick = () => avatarInput.click();
    avatarInput.onchange = async () => {
      const file = avatarInput.files[0]; avatarInput.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('Это не изображение'); return; }
      if (file.size > 5 * 1024 * 1024) { alert('Больше 5 МБ'); return; }
      const ext = file.name.split('.').pop() || 'jpg';
      const path = `avatars/${myPhone}_${Date.now()}.${ext}`;
      const { error: upErr } = await supabase.storage.from('chat-images').upload(path, file, { contentType: file.type, upsert: true });
      if (upErr) { alert('Ошибка: ' + upErr.message); return; }
      const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
      const { error: updErr } = await supabase.from('users').update({ avatar_url: urlData.publicUrl }).eq('phone', myPhone);
      if (updErr) { alert('Ошибка: ' + updErr.message); return; }
      myAvatar = urlData.publicUrl;
      const newAvatar = avatarHtml(myName, myAvatar, 80).replace('class="avatar"', 'class="avatar settings-avatar ripple-btn" id="settings-avatar"');
      document.getElementById('settings-avatar').outerHTML = newAvatar;
      updateMeHeader();
      document.getElementById('settings-avatar').onclick = () => avatarInput.click();
    };
  };
  if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/Ural-Messenger/sw.js', {
      scope: '/Ural-Messenger/'
    }).then(reg => console.log('SW зарегистрирован:', reg.scope))
      .catch(err => console.log('SW ошибка:', err));
  });
}
</script>
</body>
  </html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ural Messenger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2aabee">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --accent: #2aabee;
    --bg-app: #17212b; --bg-header: #1c2733; --bg-input: #242f3d; --bg-input-focus: #2b3a4a;
    --bg-msg-other: #182533; --bg-msg-self: #2b5278; --bg-card: #1c2733;
    --text: #f5f5f5; --text-muted: #7d8b99; --text-msg-other: #e1e1e1; --text-msg-self: #fff;
    --border: #101921; --name-color: #6ab3f3; --scroll-thumb: #2b3a4a;
  }
  [data-theme="light"] {
    --bg-app: #fff; --bg-header: #f0f2f5; --bg-input: #f0f2f5; --bg-input-focus: #e4e6eb;
    --bg-msg-other: #f0f2f5; --bg-msg-self: #dcf8c6; --bg-card: #fff;
    --text: #111; --text-muted: #707579; --text-msg-other: #111; --text-msg-self: #111;
    --border: #e4e6eb; --name-color: #2aabee; --scroll-thumb: #c4c9cc;
  }
  [data-theme="dark-blue"] {
    --bg-app: #0f1b2b; --bg-header: #142236; --bg-input: #1b2c42; --bg-input-focus: #22374f;
    --bg-msg-other: #182a40; --bg-msg-self: #27507a; --bg-card: #142236;
    --text: #e8f0f8; --text-muted: #7d90a8; --text-msg-other: #dce6f0; --text-msg-self: #fff;
    --border: #0a1420; --name-color: #5cb8f0; --scroll-thumb: #22374f;
  }
  [data-theme="dark-purple"] {
    --bg-app: #1a1426; --bg-header: #211a30; --bg-input: #2a2140; --bg-input-focus: #352a52;
    --bg-msg-other: #241c38; --bg-msg-self: #5c3d99; --bg-card: #211a30;
    --text: #f0e8ff; --text-muted: #9b8db5; --text-msg-other: #e8dffa; --text-msg-self: #fff;
    --border: #120d1c; --name-color: #b794f6; --scroll-thumb: #352a52;
  }
  [data-theme="dark-green"] {
    --bg-app: #0f1f18; --bg-header: #142a20; --bg-input: #1b3628; --bg-input-focus: #224432;
    --bg-msg-other: #182d22; --bg-msg-self: #2d6a4f; --bg-card: #142a20;
    --text: #e8f5ee; --text-muted: #7da890; --text-msg-other: #dcefe3; --text-msg-self: #fff;
    --border: #0a1710; --name-color: #52c48a; --scroll-thumb: #224432;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-app); transition: background .3s; }
  #app { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: var(--bg-app); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,.5); transition: background .3s; }
  @media (min-width: 481px) { #app { top: 20px; bottom: 20px; border-radius: 12px; } }
  .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .hidden { display: none !important; }

  @keyframes screenIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
  @keyframes avatarIn { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes ringPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .screen-anim { animation: screenIn .28s cubic-bezier(.21,1.02,.73,1); }

  #auth-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 30px; overflow-y: auto; }
  #auth-screen .logo { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #229ed9); display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; animation: float 3s ease-in-out infinite, popIn .4s cubic-bezier(.21,1.02,.73,1); }
  #auth-screen .logo .icon { width: 40px; height: 40px; stroke-width: 2.5; }
  #auth-screen h2 { color: var(--text); font-weight: 500; font-size: 20px; }
  #auth-screen input { width: 100%; max-width: 280px; padding: 12px 18px; border: 1px solid var(--bg-input); border-radius: 24px; background: var(--bg-input); color: var(--text); font-size: 15px; outline: none; text-align: center; transition: border-color .2s, box-shadow .2s, background .2s, transform .15s; }
  #auth-screen input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,171,238,.15); transform: scale(1.02); }
  .auth-tabs { display: flex; gap: 8px; }
  .auth-tab { padding: 8px 20px; border-radius: 20px; background: var(--bg-input); color: var(--text-muted); font-size: 14px; cursor: pointer; border: none; transition: background .2s, color .2s, transform .15s; }
  .auth-tab.active { background: var(--accent); color: white; }
  .auth-tab:active { transform: scale(.95); }
  .auth-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
  .auth-form button { padding: 12px 40px; border: none; border-radius: 24px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform .15s; }
  .auth-form button:active { transform: scale(.96); }
  #auth-error { color: #e74c3c; font-size: 13px; min-height: 18px; text-align: center; animation: fadeIn .2s; }

  #list-screen { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  #list-header { padding: 14px 18px; background: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .avatar { border-radius: 50%; background: linear-gradient(135deg, var(--accent), #229ed9); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; font-weight: 600; flex-shrink: 0; overflow: hidden; animation: avatarIn .3s cubic-bezier(.21,1.02,.73,1); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  #list-header .avatar { width: 38px; height: 38px; }
  #list-header .info { flex: 1; min-width: 0; color: var(--text); }
  #list-header .info .name { font-weight: 600; font-size: 15px; }
  #list-header .info .status { font-size: 12px; color: var(--text-muted); }
  .icon-btn { background: none; border: none; color: var(--text-muted); padding: 6px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, color .2s, transform .15s; flex-shrink: 0; }
  .icon-btn:hover { background: var(--bg-input); color: var(--text); }
  .icon-btn:active { transform: scale(.9); }

  #search-bar { padding: 8px 18px; background: var(--bg-header); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #search-bar input { width: 100%; padding: 9px 14px; border: none; border-radius: 18px; background: var(--bg-input); color: var(--text); font-size: 14px; outline: none; transition: background .2s, box-shadow .2s; }
  #search-bar input:focus { background: var(--bg-input-focus); box-shadow: 0 0 0 2px var(--accent); }

  #chats { flex: 1 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #chats::-webkit-scrollbar { width: 4px; }
  #chats::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
  .chat-item { padding: 12px 18px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .15s, transform .12s; animation: fadeIn .25s ease-out backwards; position: relative; overflow: hidden; }
  .chat-item:hover { background: var(--bg-input); }
  .chat-item:active { transform: scale(.98); }
  .chat-item .chat-avatar { width: 46px; height: 46px; }
  .chat-item .chat-info { flex: 1; min-width: 0; }
  .chat-item .chat-name { color: var(--text); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .chat-sub { color: var(--text-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px; animation: fadeIn .4s; }

  .skeleton { background: linear-gradient(90deg, var(--bg-input) 0%, var(--bg-input-focus) 50%, var(--bg-input) 100%); background-size: 400px 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
  .skeleton-item { padding: 12px 18px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--border); }
  .skeleton-avatar { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; }
  .skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skeleton-line { height: 12px; border-radius: 6px; }
  .skeleton-line.short { width: 60%; }

  #chat-screen { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  #header { padding: 12px 14px; background: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; z-index: 2; }
  #back-btn { background: none; border: none; color: var(--text-muted); padding: 6px; border-radius: 50%; cursor: pointer; display: flex; transition: background .2s, transform .15s; flex-shrink: 0; }
  #back-btn:hover { background: var(--bg-input); color: var(--text); }
  #back-btn:active { transform: scale(.9); }
  #header .avatar { width: 36px; height: 36px; }
  #header .info { color: var(--text); flex: 1; min-width: 0; }
  #header .info .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #header .info .status { font-size: 12px; color: var(--text-muted); word-break: break-word; }
  #call-btn { color: var(--accent) !important; background: rgba(42,171,238,0.12); }
  #call-btn:hover { background: rgba(42,171,238,0.25) !important; }
  #messages { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; flex-shrink: 0; animation: msgIn .35s cubic-bezier(.21,1.02,.73,1) forwards; opacity: 0; transform: translateY(12px) scale(.97); }
  .msg.self { align-self: flex-end; background: var(--bg-msg-self); color: var(--text-msg-self); border-bottom-right-radius: 4px; }
  .msg.other { align-self: flex-start; background: var(--bg-msg-other); color: var(--text-msg-other); border-bottom-left-radius: 4px; }
  .msg .name { font-size: 11px; font-weight: 600; color: var(--name-color); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
  .msg .name .mini-avatar { width: 18px; height: 18px; border-radius: 50%; overflow: hidden; background: linear-gradient(135deg, var(--accent), #229ed9); display: flex; align-items: center; justify-content: center; font-size: 9px; color: #fff; font-weight: 700; flex-shrink: 0; }
  .msg .time { font-size: 10px; color: var(--text-muted); float: right; margin-left: 8px; margin-top: 4px; }
  .msg img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 6px; display: block; cursor: pointer; }
  #input-area { padding: 12px 16px; background: var(--bg-header); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  #attach { width: 38px; height: 38px; border: none; border-radius: 50%; background: var(--bg-input); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, transform .15s; flex-shrink: 0; }
  #attach:hover { background: var(--bg-input-focus); color: var(--text); }
  #attach:active { transform: scale(.9); }
  #attach:disabled { opacity: .5; cursor: not-allowed; }
  #input { flex: 1; padding: 10px 16px; border: none; border-radius: 20px; background: var(--bg-input); color: var(--text); font-size: 14px; outline: none; min-width: 0; transition: background .2s; }
  #input:focus { background: var(--bg-input-focus); }
  #input::placeholder { color: var(--text-muted); }
  #send { width: 42px; height: 42px; border: none; border-radius: 50%; background: var(--accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .15s; flex-shrink: 0; }
  #send:active { transform: scale(.9); }
  #send:disabled { background: var(--bg-input-focus); color: var(--text-muted); cursor: not-allowed; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; justify-content: center; align-items: center; z-index: 100; animation: fadeIn .2s; padding: 20px; }
  .panel { background: var(--bg-card); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; color: var(--text); animation: popIn .25s cubic-bezier(.21,1.02,.73,1); max-height: 90vh; overflow-y: auto; }
  .panel h3 { margin-bottom: 16px; font-weight: 600; }
  .panel input, .panel textarea, .panel select { width: 100%; padding: 12px 16px; border: none; border-radius: 12px; background: var(--bg-input); color: var(--text); font-size: 14px; outline: none; margin-bottom: 10px; resize: none; }
  .panel input:focus, .panel textarea:focus, .panel select:focus { background: var(--bg-input-focus); box-shadow: 0 0 0 2px var(--accent); }
  .panel .btn-primary { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: transform .15s; }
  .panel .btn-primary:active { transform: scale(.97); }
  .panel .btn-secondary { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--bg-input); color: var(--text); font-size: 14px; cursor: pointer; margin-top: 8px; transition: background .2s, transform .15s; }
  .panel .btn-secondary:active { transform: scale(.97); }
  .panel .err { color: #e74c3c; font-size: 13px; min-height: 18px; margin-top: 4px; }
  .panel label.check { display: flex; align-items: center; gap: 10px; font-size: 14px; margin: 6px 0 12px; cursor: pointer; color: var(--text); }
  .panel label.check input { width: auto; margin: 0; }

  .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--bg-input); }
  .setting-row:last-of-type { border-bottom: none; }
  .setting-row label { font-size: 14px; }
  .toggle { width: 46px; height: 26px; border-radius: 13px; background: var(--bg-input-focus); border: none; cursor: pointer; position: relative; transition: background .25s; flex-shrink: 0; }
  .toggle.on { background: var(--accent); }
  .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .25s cubic-bezier(.21,1.02,.73,1); }
  .toggle.on::after { transform: translateX(20px); }
  .themes { display: flex; gap: 8px; flex-wrap: wrap; }
  .themes button { width: 36px; height: 36px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; position: relative; overflow: hidden; transition: transform .15s; }
  .themes button::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, var(--preview-bg) 50%, var(--preview-accent) 50%); }
  .themes button.active { border-color: var(--accent); }
  .themes button:active { transform: scale(.9); }
  .menu-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .menu-item { padding: 14px; border-radius: 12px; background: var(--bg-input); color: var(--text); cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: background .2s, transform .12s; }
  .menu-item:hover { background: var(--bg-input-focus); }
  .menu-item:active { transform: scale(.98); }

  .settings-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 12px; }
  .settings-avatar { width: 80px; height: 80px; font-size: 28px; cursor: pointer; transition: transform .2s; }
  .settings-avatar:hover { transform: scale(1.05); }

  .search-section-title { padding: 10px 18px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); font-weight: 700; }
  .search-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--accent); color: #fff; margin-left: 6px; font-weight: 600; }

  #call-overlay { z-index: 200; }
  #call-overlay .panel { text-align: center; }
  #call-avatar-wrap { display: flex; justify-content: center; margin-bottom: 12px; }
  #call-avatar-wrap .avatar { width: 90px; height: 90px; font-size: 34px; animation: ringPulse 1.5s ease-in-out infinite; }
  #call-timer { font-size: 32px; font-weight: 600; margin: 16px 0; letter-spacing: 1px; }
  .call-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
  .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .15s; }
  .call-btn:active { transform: scale(.9); }
  .call-btn.accept { background: #2ecc71; color: #fff; }
  .call-btn.decline { background: #e74c3c; color: #fff; }
  .call-btn.hangup { background: #e74c3c; color: #fff; }
  .call-btn .icon { width: 26px; height: 26px; stroke-width: 2.5; }

  .schedule-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .schedule-item:last-child { border-bottom: none; }
  .schedule-item .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .schedule-item .type { font-weight: 600; color: var(--accent); font-size: 13px; }
  .schedule-item .date { font-size: 10px; color: var(--text-muted); }
  .schedule-item .body { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .schedule-item img { max-width: 100%; border-radius: 8px; margin-top: 6px; }
</style>
</head>
<body>

<div id="app">
  <div id="auth-screen">
    <div class="logo">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </div>
    <h2>Ural Messenger</h2>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Войти</button>
      <button class="auth-tab" id="tab-create">Регистрация</button>
    </div>
    <div class="auth-form" id="form-login">
      <input type="tel" id="login-phone" placeholder="Номер телефона" maxlength="20">
      <input type="password" id="login-password" placeholder="Пароль" maxlength="50">
      <button id="login-btn">Войти</button>
    </div>
    <div class="auth-form hidden" id="form-create">
      <input type="text" id="create-name" placeholder="Ваше имя" maxlength="20">
      <input type="tel" id="create-phone" placeholder="Номер телефона" maxlength="20">
      <input type="password" id="create-password" placeholder="Придумайте пароль" maxlength="50">
      <button id="create-btn">Создать аккаунт</button>
    </div>
    <div id="auth-error"></div>
  </div>

  <div id="list-screen" class="hidden">
    <div id="list-header">
      <div class="avatar" id="me-avatar">?</div>
      <div class="info">
        <div class="name" id="me-name">Пользователь</div>
        <div class="status" id="me-status">Список чатов</div>
      </div>
      <button class="icon-btn" id="schedule-btn" title="Расписание / ДЗ">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>

  }

  async function getPeerPhone(chatId) {
    const { data } = await supabase.from('chat_members').select('user_phone').eq('chat_id', chatId).neq('user_phone', myPhone).limit(1);
    return data && data[0] ? data[0].user_phone : null;
  }

  async function startCall() {
    if (isCallActive || !currentChatId || currentChatType !== 'direct') return;
    isCallActive = true; currentPeerName = chatTitleEl.textContent;
    callOverlay.classList.remove('hidden');
    callTitle.textContent = currentPeerName;
    callAvatarEl.outerHTML = avatarHtml(currentPeerName, '', 90).replace('class="avatar"', 'class="avatar" id="call-avatar"');
    callStatus.textContent = 'Вызов...';
    callAcceptBtn.style.display = 'none'; callHangupBtn.style.display = 'flex'; callDeclineBtn.style.display = 'none';

    const ok = await setupPeer(); if (!ok) return;

    const peerPhone = await getPeerPhone(currentChatId);
    if (!peerPhone) { callStatus.textContent = 'Собеседник не найден'; setTimeout(cleanupCall, 1500); return; }

    callChannel = supabase.channel('user-' + peerPhone, { config: { broadcast: { self: false } } });
    callChannel
      .on('broadcast', { event: 'answer' }, async ({ payload }) => {
        if (peerConnection && payload.sdp) { await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp)); callStatus.textContent = 'Соединение...'; }
      })
      .on('broadcast', { event: 'ice' }, async ({ payload }) => {
        if (peerConnection && payload.candidate) { try { await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch (e) {} }
      })
      .on('broadcast', { event: 'decline' }, () => { callStatus.textContent = 'Отклонён'; setTimeout(cleanupCall, 1200); })
      .on('broadcast', { event: 'hangup' }, () => { callStatus.textContent = 'Завершён'; setTimeout(cleanupCall, 800); })
      .subscribe(async status => {
        if (status === 'SUBSCRIBED') {
          const offer = await peerConnection.createOffer();
          await peerConnection.setLocalDescription(offer);
          callChannel.send({
            type: 'broadcast', event: 'incoming-call',
            payload: { to: peerPhone, from: myName, fromPhone: myPhone, sdp: offer, chatId: currentChatId }
          });
        }
      });
  }

  function setupGlobalCallListener() {
    if (window._globalCallChannel) supabase.removeChannel(window._globalCallChannel);
    window._globalCallChannel = supabase.channel('user-' + myPhone, { config: { broadcast: { self: false } } });
    window._globalCallChannel
      .on('broadcast', { event: 'incoming-call' }, async ({ payload }) => {
        if (isCallActive || payload.to !== myPhone) return;
        window._pendingOffer = payload.sdp;
        window._incomingChatId = payload.chatId;
        window._incomingFrom = payload.from;
        window._incomingFromPhone = payload.fromPhone;
        callChannel = window._globalCallChannel;
        await showIncoming(payload.from, payload.fromPhone);
      })
      .on('broadcast', { event: 'ice' }, async ({ payload }) => {
        if (peerConnection && payload.candidate) { try { await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch (e) {} }
      })
      .subscribe();
  }

  async function showIncoming(fromName, fromPhone) {
    if (isCallActive) return;
    isCallActive = true; currentPeerName = fromName;
    callOverlay.classList.remove('hidden');
    callTitle.textContent = fromName;
    callAvatarEl.outerHTML = avatarHtml(fromName, '', 90).replace('class="avatar"', 'class="avatar" id="call-avatar"');
    callStatus.textContent = 'Входящий звонок...';
    callAcceptBtn.style.display = 'flex'; callDeclineBtn.style.display = 'flex'; callHangupBtn.style.display = 'none';
    if (settings.sound) { playPing(); setTimeout(playPing, 400); }
  }

  callAcceptBtn.onclick = async () => {
    callAcceptBtn.style.display = 'none'; callDeclineBtn.style.display = 'none'; callHangupBtn.style.display = 'flex';
    callStatus.textContent = 'Соединение...';
    const ok = await setupPeer(); if (!ok) return;
    if (window._pendingOffer) {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(window._pendingOffer));
      const ans = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(ans);
      callChannel.send({ type: 'broadcast', event: 'answer', payload: { sdp: ans } });
      window._pendingOffer = null;
    }
  };

  callDeclineBtn.onclick = () => {
    if (callChannel) callChannel.send({ type: 'broadcast', event: 'decline', payload: {} });
    cleanupCall();
  };
  callHangupBtn.onclick = () => {
    if (callChannel) callChannel.send({ type: 'broadcast', event: 'hangup', payload: {} });
    cleanupCall();
  };

  callBtn.onclick = startCall;

  // ===== CHAT =====
  async function openChat(chatId, title, type, avatarUrl) {
    currentChatId = chatId; currentChatType = type;
    renderedIds.clear();
    messagesEl.innerHTML = '';
    chatTitleEl.textContent = title;
    chatAvatarEl.outerHTML = avatarHtml(title, avatarUrl, 36).replace('class="avatar"', 'id="chat-avatar" class="avatar"');
    chatStatusEl.textContent = 'Загрузка...';
    callBtn.classList.toggle('hidden', type !== 'direct');
    listScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
    chatScreen.classList.add('screen-anim');
    inputEl.disabled = true; sendBtn.disabled = true;

    const { data: history, error } = await supabase.from('messages').select('*').eq('chat_id', chatId).order('created_at', { ascending: true }).limit(100);
    if (error) chatStatusEl.textContent = 'История: ' + error.message;
    else if (history) history.forEach(m => {
      if (!renderedIds.has(m.id)) { renderedIds.add(m.id); addMessage(m.user_name, m.text, m.user_name === myName, m.created_at, m.image_url); }
    });

    if (channel) { supabase.removeChannel(channel); channel = null; }
    channel = supabase.channel('msg-' + chatId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` }, payload => {
        const m = payload.new;
        if (renderedIds.has(m.id)) return;
        renderedIds.add(m.id);
        addMessage(m.user_name, m.text, m.user_name === myName, m.created_at, m.image_url);
        if (m.user_name !== myName) playPing();
      })
      .subscribe(status => {
        if (status === 'SUBSCRIBED') {
          chatStatusEl.textContent = type === 'group' ? 'Группа' : 'Личный чат';
          inputEl.disabled = false; sendBtn.disabled = false; inputEl.focus();
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') chatStatusEl.textContent = 'Переподключение...';
      });

    if (!sendBtn.dataset.bound) {
      sendBtn.dataset.bound = '1';
      sendBtn.onclick = sendMessage;
      inputEl.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
      document.getElementById('attach').onclick = () => { if (!isSending) document.getElementById('file-input').click(); };
      document.getElementById('file-input').onchange = handleFileUpload;
    }
  }

  document.getElementById('back-btn').onclick = () => {
    if (channel) { supabase.removeChannel(channel); channel = null; }
    if (isCallActive) cleanupCall();
    currentChatId = null;
    chatScreen.classList.add('hidden');
    listScreen.classList.remove('hidden');
    listScreen.classList.add('screen-anim');
    loadChats();
  };

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isSending || !currentChatId) return;
    isSending = true; sendBtn.disabled = true; inputEl.value = '';
    const { error } = await supabase.from('messages').insert({ user_name: myName, text, image_url: null, chat_id: currentChatId });
    if (error) { chatStatusEl.textContent = 'Отправка: ' + error.message; inputEl.value = text; }
    isSending = false; sendBtn.disabled = false; inputEl.focus();
  }

  async function handleFileUpload() {
    const fi = document.getElementById('file-input');
    const file = fi.files[0]; fi.value = '';
    if (!file || isSending || !currentChatId) return;
    if (!file.type.startsWith('image/')) { chatStatusEl.textContent = 'Не изображение'; return; }
    if (file.size > 5 * 1024 * 1024) { chatStatusEl.textContent = 'Больше 5 МБ'; return; }
    isSending = true; sendBtn.disabled = true; chatStatusEl.textContent = 'Загрузка...';
    try {
      const ext = file.name.split('.').pop() || 'jpg';
      const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error: upErr } = await supabase.storage.from('chat-images').upload(path, file, { contentType: file.type, cacheControl: '3600' });
      if (upErr) { chatStatusEl.textContent = 'Фото: ' + upErr.message; return; }
      const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
      const { error: insErr } = await supabase.from('messages').insert({ user_name: myName, text: '', image_url: urlData.publicUrl, chat_id: currentChatId });
      if (insErr) chatStatusEl.textContent = 'Фото: ' + insErr.message;
      else chatStatusEl.textContent = currentChatType === 'group' ? 'Группа' : 'Личный чат';
    } finally { isSending = false; sendBtn.disabled = false; inputEl.focus(); }
  }

  function addMessage(name, text, isSelf, createdAt, imageUrl) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isSelf ? 'self' : 'other');
    const time = createdAt ? new Date(createdAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
    const nameHtml = !isSelf ? `<div class="name"><span class="mini-avatar">${escapeHtml(initials(name))}</span>${escapeHtml(name)}</div>` : '';
    const textHtml = text ? escapeHtml(text) : '';
    const imgHtml = imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="фото" loading="lazy">` : '';
    div.innerHTML = `${nameHtml}${textHtml}${imgHtml}<span class="time">${time}</span>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ===== SCHEDULE / HOMEWORK =====
  document.getElementById('schedule-btn').onclick = async () => {
    const { data: memberships } = await supabase.from('chat_members').select('chat_id').eq('user_phone', myPhone);
    if (!memberships || !memberships.length) { alert('Сначала создай или найди чат'); return; }
    const ids = [...new Set(memberships.map(m => m.chat_id))];
    const { data: chats } = await supabase.from('chats').select('id, name, type').in('id', ids);
    if (!chats || !chats.length) { alert('Нет чатов'); return; }

    const ov = document.createElement('div'); ov.className = 'overlay';
    const opts = chats.map(c => `<option value="${c.id}">${escapeHtml(c.name || (c.type==='direct'?'Личный чат':'Группа'))}</option>`).join('');
    ov.innerHTML = `<div class="panel"><h3>Расписание / ДЗ</h3>
      <select id="sch-chat">${opts}</select>
      <select id="sch-type"><option value="schedule">Расписание</option><option value="homework">Домашнее задание</option></select>
      <textarea id="sch-text" placeholder="Текст (необязательно)" rows="3"></textarea>
      <input type="file" id="sch-file" accept="image/*" style="display:none;">
      <button class="btn-secondary" id="sch-pick" style="margin-bottom:8px;">Прикрепить фото</button>
      <div id="sch-preview" style="color:var(--text-muted);font-size:12px;margin-bottom:8px;"></div>
      <button class="btn-primary" id="sch-save">Опубликовать</button>
      <button class="btn-secondary" id="sch-view">Посмотреть</button>
      <button class="btn-secondary" id="sch-cancel">Отмена</button>
    </div>`;
    document.body.appendChild(ov);
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
    document.getElementById('sch-cancel').onclick = () => ov.remove();

    const fileInput = document.getElementById('sch-file');
    let uploadedUrl = '';
    document.getElementById('sch-pick').onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      const file = fileInput.files[0]; if (!file) return;
      if (!file.type.startsWith('image/')) { alert('Не изображение'); return; }
      if (file.size > 5*1024*1024) { alert('Больше 5 МБ'); return; }
      const ext = file.name.split('.').pop() || 'jpg';
      const path = `schedule/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error } = await supabase.storage.from('chat-images').upload(path, file, { contentType: file.type });
      if (error) { alert('Ошибка: ' + error.message); return; }
      uploadedUrl = supabase.storage.from('chat-images').getPublicUrl(path).data.publicUrl;
      document.getElementById('sch-preview').textContent = 'Фото прикреплено';
    };
    document.getElementById('sch-save').onclick = async () => {
      const chatId = document.getElementById('sch-chat').value;
      const type = document.getElementById('sch-type').value;
      const text = document.getElementById('sch-text').value.trim();
      if (!text && !uploadedUrl) { alert('Добавь текст или фото'); return; }
      const { error } = await supabase.from('schedule').insert({ chat_id: chatId, type, content: text || null, image_url: uploadedUrl || null, created_by: myPhone });
      if (error) { alert('Ошибка: ' + error.message); return; }
      ov.remove(); alert('Опубликовано!');
    };
    document.getElementById('sch-view').onclick = async () => {
      const chatId = document.getElementById('sch-chat').value;
      const { data } = await supabase.from('schedule').select('*').eq('chat_id', chatId).order('created_at', { ascending: false }).limit(30);
      if (!data || !data.length) { alert('Пока пусто'); return; }
      const html = data.map(s => `
        <div class="schedule-item">
          <div class="head"><span class="type">${s.type==='schedule'?'📅 Расписание':'📚 ДЗ'}</span><span class="date">${new Date(s.created_at).toLocaleString('ru-RU')}</span></div>
          ${s.content ? `<div class="body">${escapeHtml(s.content)}</div>` : ''}
          ${s.image_url ? `<img src="${escapeHtml(s.image_url)}" loading="lazy">` : ''}
        </div>`).join('');
      const viewOv = document.createElement('div'); viewOv.className = 'overlay';
      viewOv.innerHTML = `<div class="panel" style="max-height:85vh;overflow-y:auto;">${html}<button class="btn-secondary" id="sch-close">Закрыть</button></div>`;
      document.body.appendChild(viewOv);
      viewOv.onclick = e => { if (e.target === viewOv) viewOv.remove(); };
      document.getElementById('sch-close').onclick = () => viewOv.remove();
    };
  };

  // ===== MODALS =====
  document.getElementById('new-chat-btn').onclick = () => {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="panel"><h3>Новый чат</h3><div class="menu-list"><div class="menu-item" id="m-g">Создать группу</div><div class="menu-item" id="m-f">Добавить друга по номеру</div></div><button class="btn-secondary" id="m-c" style="margin-top:16px;">Отмена</button></div>`;
    document.body.appendChild(ov);
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
    document.getElementById('m-c').onclick = () => ov.remove();
    document.getElementById('m-g').onclick = () => { ov.remove(); showCreateGroup(); };
    document.getElementById('m-f').onclick = () => { ov.remove(); showAddFriend(); };
  };

  function showCreateGroup() {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="panel"><h3>Создать группу</h3><input type="text" id="g-n" placeholder="Название" maxlength="40"><textarea id="g-d" placeholder="Описание (для поиска)" rows="2"></textarea><label class="check"><input type="checkbox" id="g-p"> Публичная</label><input type="text" id="g-m" placeholder="Номера через запятую"><div class="err" id="g-e"></div><button class="btn-primary" id="g-ok">Создать</button><button class="btn-secondary" id="g-c">Отмена</button></div>`;
    document.body.appendChild(ov);
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
    document.getElementById('g-c').onclick = () => ov.remove();
    document.getElementById('g-ok').onclick = async () => {
      const err = document.getElementById('g-e');
      const name = document.getElementById('g-n').value.trim();
      const desc = document.getElementById('g-d').value.trim();
      const pub = document.getElementById('g-p').checked;
      if (!name) { err.textContent = 'Введите название'; return; }
      const phones = [...new Set(document.getElementById('g-m').value.split(',').map(s => normalizePhone(s.trim())).filter(Boolean))];
      const { data: chat, error } = await supabase.from('chats').insert({ type: 'group', name, description: desc || null, is_public: pub, created_by: myPhone }).select().single();
      if (error) { err.textContent = error.message; return; }
      await supabase.from('chat_members').insert({ chat_id: chat.id, user_phone: myPhone });
      for (const p of phones) { if (p === myPhone) continue; const { data: u } = await supabase.from('users').select('phone').eq('phone', p).single(); if (u) await supabase.from('chat_members').insert({ chat_id: chat.id, user_phone: p }); }
      ov.remove(); await loadChats();
    };
  }

  function showAddFriend() {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="panel"><h3>Добавить друга</h3><input type="tel" id="f-p" placeholder="Номер (можно 8... или +7...)"><div class="err" id="f-e"></div><button class="btn-primary" id="f-ok">Найти</button><button class="btn-secondary" id="f-c">Отмена</button></div>`;
    document.body.appendChild(ov);
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
    document.getElementById('f-c').onclick = () => ov.remove();
    document.getElementById('f-ok').onclick = async () => {
      const err = document.getElementById('f-e');
      const p = normalizePhone(document.getElementById('f-p').value.trim());
      if (!p || p.length !== 12) { err.textContent = 'Введите корректный номер'; return; }
      if (p === myPhone) { err.textContent = 'Это ваш номер'; return; }
      const { data: user } = await supabase.from('users').select('name').eq('phone', p).single();
      if (!user) { err.textContent = 'Пользователь не найден'; return; }
      ov.remove(); await startDirect(p);
    };
  }

  document.getElementById('settings-btn').onclick = () => {
    const THEMES = [
      { id: 'dark', bg: '#17212b', accent: '#2aabee' },
      { id: 'light', bg: '#ffffff', accent: '#2aabee' },
      { id: 'dark-blue', bg: '#0f1b2b', accent: '#2aabee' },
      { id: 'dark-purple', bg: '#1a1426', accent: '#9b59b6' },
      { id: 'dark-green', bg: '#0f1f18', accent: '#2ecc71' }
    ];
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="panel"><h3>Настройки</h3><div class="settings-avatar-wrap">${avatarHtml(myName, myAvatar, 80).replace('class="avatar"', 'class="avatar settings-avatar" id="s-av"')}<button class="btn-secondary" id="s-ch" style="width:auto;padding:8px 16px;margin:0;">Сменить аватар</button><input type="file" id="s-fi" accept="image/*" hidden></div><div class="setting-row"><label>Звук</label><button class="toggle ${settings.sound?'on':''}" id="s-snd"></button></div><div class="setting-row" style="flex-direction:column;align-items:flex-start;gap:10px;"><label>Тема</label><div class="themes" id="s-th">${THEMES.map(t=>`<button data-id="${t.id}" class="${settings.theme===t.id?'active':''}" style="--preview-bg:${t.bg};--preview-accent:${t.accent};"></button>`).join('')}</div></div><div class="setting-row" style="flex-direction:column;align-items:flex-start;gap:10px;"><label>Акцент</label><div class="themes" id="s-ac">${['#2aabee','#e74c3c','#2ecc71','#9b59b6','#f39c12'].map(a=>`<button data-accent="${a}" class="${settings.accent===a?'active':''}" style="--preview-bg:${a};--preview-accent:${a};"></button>`).join('')}</div></div><button class="btn-secondary" id="s-lo" style="margin-top:14px;">Выйти</button><button class="btn-secondary" id="s-cl">Закрыть</button></div>`;
    document.body.appendChild(ov);
    ov.onclick = e => { if (e.target === ov) ov.remove(); };
    document.getElementById('s-cl').onclick = () => ov.remove();
    document.getElementById('s-snd').onclick = e => { settings.sound = !settings.sound; localStorage.setItem('chat_sound', settings.sound?'on':'off'); e.target.classList.toggle('on', settings.sound); if (settings.sound) playPing(); };
    ov.querySelectorAll('#s-th button').forEach(b => b.onclick = () => { settings.theme = b.dataset.id; localStorage.setItem('chat_theme', settings.theme); applyTheme(); ov.querySelectorAll('#s-th button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
    ov.querySelectorAll('#s-ac button').forEach(b => b.onclick = () => { settings.accent = b.dataset.accent; localStorage.setItem('chat_accent', settings.accent); applyTheme(); ov.querySelectorAll('#s-ac button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
    document.getElementById('s-lo').onclick = () => { localStorage.removeItem('chat_name'); localStorage.removeItem('chat_phone'); location.reload(); };
    const fi = document.getElementById('s-fi');
    document.getElementById('s-ch').onclick = () => fi.click();
    document.getElementById('s-av').onclick = () => fi.click();
    fi.onchange = async () => {
      const file = fi.files[0]; fi.value = ''; if (!file) return;
      if (!file.type.startsWith('image/')) { alert('Не изображение'); return; }
      if (file.size > 5*1024*1024) { alert('Больше 5 МБ'); return; }
      const ext = file.name.split('.').pop() || 'jpg';
      const path = `avatars/${myPhone}_${Date.now()}.${ext}`;
      const { error: upErr } = await supabase.storage.from('chat-images').upload(path, file, { contentType: file.type, upsert: true });
      if (upErr) { alert('Ошибка: ' + upErr.message); return; }
      const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
      const { error: updErr } = await supabase.from('users').update({ avatar_url: urlData.publicUrl }).eq('phone', myPhone);
      if (updErr) { alert('Ошибка: ' + updErr.message); return; }
      myAvatar = urlData.publicUrl;
      document.getElementById('s-av').outerHTML = avatarHtml(myName, myAvatar, 80).replace('class="avatar"', 'class="avatar settings-avatar" id="s-av"');
      updateMeHeader();
      document.getElementById('s-av').onclick = () => fi.click();
    };
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/Ural-Messenger/sw.js', { scope: '/Ural-Messenger/' })
        .then(reg => console.log('SW:', reg.scope)).catch(err => console.log('SW err:', err));
    });
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ural Messenger</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0e1621;
  }
  #app {
    position: fixed; inset: 0; max-width: 480px; margin: 0 auto;
    background: #17212b; display: flex; flex-direction: column;
    overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  @media (min-width: 481px) { #app { top: 20px; bottom: 20px; border-radius: 12px; } }

  /* Экран входа */
  #auth-screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    padding: 30px; overflow-y: auto;
  }
  #auth-screen .logo {
    width: 80px; height: 80px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent, #2aabee), #229ed9);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; flex-shrink: 0;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  #auth-screen h2 { color: #f5f5f5; font-weight: 500; font-size: 20px; }
  #auth-screen input {
    width: 100%; max-width: 280px; padding: 12px 18px;
    border: 1px solid #2b3a4a; border-radius: 24px;
    background: #242f3d; color: #f5f5f5; font-size: 15px;
    outline: none; text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #auth-screen input:focus { border-color: var(--accent, #2aabee); box-shadow: 0 0 0 3px rgba(42,171,238,0.15); }
  .auth-tabs { display: flex; gap: 8px; }
  .auth-tab {
    padding: 8px 20px; border: none; border-radius: 20px;
    background: #242f3d; color: #7d8b99; font-size: 14px;
    cursor: pointer; transition: background 0.2s, color 0.2s;
  }
  .auth-tab.active { background: var(--accent, #2aabee); color: white; }
  .auth-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 280px; }
  .auth-form.hidden { display: none; }
  .auth-form button {
    padding: 12px 40px; border: none; border-radius: 24px;
    background: var(--accent, #2aabee); color: white;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .auth-form button:hover { filter: brightness(1.1); }
  .auth-form button:active { transform: scale(0.96); }
  #auth-error { color: #e74c3c; font-size: 13px; min-height: 18px; text-align: center; }

  /* Чат */
  #chat-screen {
    flex: 1 1 0; min-height: 0;
    display: flex; flex-direction: column;
  }
  #chat-screen.hidden { display: none !important; }
  #header {
    padding: 14px 18px; background: #1c2733;
    border-bottom: 1px solid #101921;
    display: flex; align-items: center; gap: 10px; flex-shrink: 0; z-index: 2;
  }
  #header .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent, #2aabee), #229ed9);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: white; font-weight: 600;
    flex-shrink: 0; cursor: pointer; transition: transform 0.2s;
  }
  #header .avatar:hover { transform: scale(1.05); }
  #header .info { color: #f5f5f5; flex: 1; min-width: 0; }
  #header .info .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #header .info .status { font-size: 12px; color: #7d8b99; word-break: break-word; }
  #header .icon-btn {
    background: none; border: none; color: #7d8b99; font-size: 20px;
    cursor: pointer; padding: 6px; border-radius: 8px;
    transition: background 0.2s, color 0.2s, transform 0.15s; flex-shrink: 0;
  }
  #header .icon-btn:hover { background: #242f3d; color: #fff; transform: scale(1.05); }
  #header .icon-btn:active { transform: scale(0.92); }

  #messages {
    flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden;
    padding: 16px; display: flex; flex-direction: column; gap: 6px;
    scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 4px; }
  .msg {
    max-width: 80%; padding: 8px 12px; border-radius: 12px;
    font-size: 14px; line-height: 1.4; word-break: break-word; flex-shrink: 0;
    animation: msgIn 0.35s cubic-bezier(0.21, 1.02, 0.73, 1) forwards;
    opacity: 0; transform: translateY(12px) scale(0.97);
  }
  @keyframes msgIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  .msg.self { align-self: flex-end; background: var(--accent, #2b5278); color: #fff; border-bottom-right-radius: 4px; }
  .msg.other { align-self: flex-start; background: #182533; color: #e1e1e1; border-bottom-left-radius: 4px; }
  .msg .name { font-size: 11px; font-weight: 600; color: #6ab3f3; margin-bottom: 2px; }
  .msg .time { font-size: 10px; color: #7d8b99; float: right; margin-left: 8px; margin-top: 4px; }
  .msg img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 6px; display: block; cursor: pointer; }

  #input-area {
    padding: 12px 16px; background: #1c2733;
    border-top: 1px solid #101921;
    display: flex; gap: 8px; align-items: center; flex-shrink: 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom)); z-index: 2;
  }
  #attach {
    width: 38px; height: 38px; border: none; border-radius: 50%;
    background: #242f3d; color: #a0b0c0; font-size: 18px;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.2s, transform 0.15s;
  }
  #attach:hover { background: #2b3a4a; }
  #attach:active { transform: scale(0.92); }
  #attach:disabled { opacity: 0.5; cursor: not-allowed; }
  #input {
    flex: 1; padding: 10px 16px; border: none; border-radius: 20px;
    background: #242f3d; color: #f5f5f5; font-size: 14px;
    outline: none; transition: background 0.2s; min-width: 0;
  }
  #input:focus { background: #2b3a4a; }
  #input::placeholder { color: #6c7883; }
  #send {
    width: 42px; height: 42px; border: none; border-radius: 50%;
    background: var(--accent, #2aabee); color: white; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.2s; flex-shrink: 0;
  }
  #send:hover { filter: brightness(1.1); }
  #send:active { transform: scale(0.92); }
  #send:disabled { background: #3a4a5a; cursor: not-allowed; }

  /* Настройки */
  #settings-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; justify-content: center; align-items: center;
    z-index: 100; animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #settings-panel {
    background: #1c2733; border-radius: 16px; padding: 24px;
    width: 90%; max-width: 360px; color: #f5f5f5;
    animation: popIn 0.25s cubic-bezier(0.21, 1.02, 0.73, 1);
  }
  @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #settings-panel h3 { margin-bottom: 16px; font-weight: 600; }
  .setting-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #2b3a4a;
  }
  .setting-row:last-of-type { border-bottom: none; }
  .setting-row label { font-size: 14px; }
  .toggle {
    width: 46px; height: 26px; border-radius: 13px;
    background: #3a4a5a; border: none; cursor: pointer;
    position: relative; transition: background 0.2s;
  }
  .toggle.on { background: var(--accent, #2aabee); }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); }
  .colors { display: flex; gap: 8px; }
  .colors button {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; transition: transform 0.15s, border-color 0.2s;
  }
  .colors button:hover { transform: scale(1.1); }
  .colors button.active { border-color: #fff; }
  #settings-close {
    margin-top: 20px; width: 100%; padding: 12px;
    border: none; border-radius: 12px; background: #242f3d;
    color: #f5f5f5; font-size: 14px; cursor: pointer;
    transition: background 0.2s;
  }
  #settings-close:hover { background: #2b3a4a; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app">
  <div id="auth-screen">
    <div class="logo">💬</div>
    <h2>Ural Messenger</h2>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Войти</button>
      <button class="auth-tab" id="tab-create">Создать</button>
    </div>

    <div class="auth-form" id="form-login">
      <input type="text" id="login-name" placeholder="Ваше имя" maxlength="20">
      <input type="text" id="login-room" placeholder="Имя комнаты" maxlength="20">
      <input type="password" id="login-password" placeholder="Пароль комнаты" maxlength="30">
      <button id="login-btn">Войти в чат</button>
    </div>

    <div class="auth-form hidden" id="form-create">
      <input type="text" id="create-name" placeholder="Ваше имя" maxlength="20">
      <input type="text" id="create-room" placeholder="Название комнаты" maxlength="20">
      <input type="password" id="create-password" placeholder="Придумайте пароль" maxlength="30">
      <button id="create-btn">Создать комнату</button>
    </div>

    <div id="auth-error"></div>
  </div>

  <div id="chat-screen" class="hidden">
    <div id="header">
      <div class="avatar" id="user-avatar">?</div>
      <div class="info">
        <div class="name" id="room-name-display">Комната</div>
        <div class="status" id="status">Подключение...</div>
      </div>
      <button class="icon-btn" id="settings-btn" title="Настройки">⚙️</button>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <button id="attach" title="Отправить фото">📎</button>
      <input type="file" id="file-input" accept="image/*" hidden>
      <input type="text" id="input" placeholder="Написать сообщение..." disabled>
      <button id="send" disabled>➤</button>
    </div>
  </div>
</div>

<script type="module">
  const SUPABASE_URL = 'https://mlmydwdpffkvopnephxb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sbXlkd2RwZmZrdm9wbmVwaHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDE5MzAsImV4cCI6MjEwNzg3NzkzMH0.CfBxElG-GYV7OCeMLJmzaAcQYWxu_nAglZGhGFd5hzA';

  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const authScreen = document.getElementById('auth-screen');
  const chatScreen = document.getElementById('chat-screen');
  const tabLogin = document.getElementById('tab-login');
  const tabCreate = document.getElementById('tab-create');
  const formLogin = document.getElementById('form-login');
  const formCreate = document.getElementById('form-create');
  const authError = document.getElementById('auth-error');
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const avatarEl = document.getElementById('user-avatar');
  const settingsBtn = document.getElementById('settings-btn');
  const attachBtn = document.getElementById('attach');
  const fileInput = document.getElementById('file-input');
  const roomNameDisplay = document.getElementById('room-name-display');

  let myName = '';
  let currentRoom = '';
  let channel = null;
  let isSending = false;
  const renderedIds = new Set();

  const settings = {
    sound: localStorage.getItem('chat_sound') !== 'off',
    accent: localStorage.getItem('chat_accent') || '#2aabee'
  };
  document.documentElement.style.setProperty('--accent', settings.accent);

  let audioCtx = null;
  function playPing() {
    if (!settings.sound) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } catch (e) {}
  }

  tabLogin.addEventListener('click', () => {
    tabLogin.classList.add('active');
    tabCreate.classList.remove('active');
    formLogin.classList.remove('hidden');
    formCreate.classList.add('hidden');
    authError.textContent = '';
  });
  tabCreate.addEventListener('click', () => {
    tabCreate.classList.add('active');
    tabLogin.classList.remove('active');
    formCreate.classList.remove('hidden');
    formLogin.classList.add('hidden');
    authError.textContent = '';
  });

  document.getElementById('create-btn').addEventListener('click', async () => {
    const name = document.getElementById('create-name').value.trim();
    const room = document.getElementById('create-room').value.trim().toLowerCase().replace(/\s+/g, '-');
    const pass = document.getElementById('create-password').value.trim();
    if (!name || !room || !pass) { authError.textContent = 'Заполните все поля'; return; }

    try {
      const { error } = await supabase.from('rooms').insert({ name: room, password: pass });
      if (error) {
        if (error.code === '23505') authError.textContent = 'Комната с таким именем уже есть';
        else authError.textContent = 'Ошибка: ' + error.message;
        return;
      }
      myName = name; currentRoom = room;
      localStorage.setItem('chat_saved_name', myName);
      localStorage.setItem('chat_saved_room', currentRoom);
      enterChat();
    } catch (e) { authError.textContent = 'Сеть: ' + e.message; }
  });

  document.getElementById('login-btn').addEventListener('click', async () => {
    const name = document.getElementById('login-name').value.trim();
    const room = document.getElementById('login-room').value.trim().toLowerCase().replace(/\s+/g, '-');
    const pass = document.getElementById('login-password').value.trim();
    if (!name || !room || !pass) { authError.textContent = 'Заполните все поля'; return; }

    try {
      const { data, error } = await supabase
        .from('rooms').select('password').eq('name', room).single();
      if (error || !data) { authError.textContent = 'Комната не найдена'; return; }
      if (data.password !== pass) { authError.textContent = 'Неверный пароль'; return; }

      myName = name; currentRoom = room;
      localStorage.setItem('chat_saved_name', myName);
      localStorage.setItem('chat_saved_room', currentRoom);
      enterChat();
    } catch (e) { authError.textContent = 'Сеть: ' + e.message; }
  });

  window.addEventListener('DOMContentLoaded', async () => {
    const name = localStorage.getItem('chat_saved_name');
    const room = localStorage.getItem('chat_saved_room');
    if (name && room) {
      try {
        const { data, error } = await supabase.from('rooms').select('name').eq('name', room).single();
        if (!error && data) {
          myName = name; currentRoom = room;
          enterChat();
        }
      } catch (e) {}
    }
  });

  function enterChat() {
    authScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
    avatarEl.textContent = myName.charAt(0).toUpperCase();
    roomNameDisplay.textContent = '# ' + currentRoom;
    initChat();
  }

  async function initChat() {
    statusEl.textContent = 'Загрузка истории...';

    try {
      const { data: history, error } = await supabase
        .from('messages').select('*')
        .eq('room', currentRoom)
        .order('created_at', { ascending: true }).limit(100);

      if (error) { statusEl.textContent = 'История: ' + error.message; }
      else if (history) {
        history.forEach(m => {
          if (!renderedIds.has(m.id)) {
            renderedIds.add(m.id);
            addMessage(m.user_name, m.text, m.user_name === myName, m.created_at, m.image_url);
          }
        });
      }
    } catch (e) { statusEl.textContent = 'Сеть: ' + e.message; }

    channel = supabase
      .channel(`room-${currentRoom}`)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'messages',
        filter: `room=eq.${currentRoom}`
      }, (payload) => {
        const m = payload.new;
        if (renderedIds.has(m.id)) return;
        renderedIds.add(m.id);
        addMessage(m.user_name, m.text, m.user_name === myName, m.created_at, m.image_url);
        if (m.user_name !== myName) playPing();
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          statusEl.textContent = `Вы: ${myName}`;
          inputEl.disabled = false;
          sendBtn.disabled = false;
          inputEl.focus();
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          statusEl.textContent = 'Переподключение...';
        }
      });

    if (!sendBtn.dataset.bound) {
      sendBtn.dataset.bound = '1';
      sendBtn.addEventListener('click', sendMessage);
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });
      attachBtn.addEventListener('click', () => { if (!isSending) fileInput.click(); });
      fileInput.addEventListener('change', handleFileUpload);
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isSending) return;
    isSending = true;
    sendBtn.disabled = true;
    inputEl.value = '';

    try {
      const { error } = await supabase.from('messages')
        .insert({ user_name: myName, text: text, image_url: null, room: currentRoom });
      if (error) { statusEl.textContent = 'Отправка: ' + error.message; inputEl.value = text; }
    } catch (e) { statusEl.textContent = 'Сеть: ' + e.message; inputEl.value = text; }
    finally { isSending = false; sendBtn.disabled = false; inputEl.focus(); }
  }

  async function handleFileUpload() {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file || isSending) return;
    if (!file.type.startsWith('image/')) { statusEl.textContent = 'Фото: это не изображение'; return; }
    if (file.size > 5 * 1024 * 1024) { statusEl.textContent = 'Фото: файл больше 5 МБ'; return; }

    isSending = true; sendBtn.disabled = true; attachBtn.disabled = true;
    statusEl.textContent = 'Фото: загрузка...';

    try {
      const ext = file.name.split('.').pop() || 'jpg';
      const path = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;

      const { error: uploadError } = await supabase.storage
        .from('chat-images').upload(path, file, { contentType: file.type || 'image/jpeg', upsert: false, cacheControl: '3600' });

      if (uploadError) { statusEl.textContent = 'Фото: ' + (uploadError.message || JSON.stringify(uploadError)); return; }

      statusEl.textContent = 'Фото: отправка...';
      const { data: urlData } = supabase.storage.from('chat-images').getPublicUrl(path);
      if (!urlData || !urlData.publicUrl) { statusEl.textContent = 'Фото: не удалось получить URL'; return; }

      const { error: insertError } = await supabase.from('messages')
        .insert({ user_name: myName, text: '', image_url: urlData.publicUrl, room: currentRoom });
      if (insertError) { statusEl.textContent = 'Фото: ' + (insertError.message || JSON.stringify(insertError)); }
      else { statusEl.textContent = `Вы: ${myName}`; }
    } catch (e) { statusEl.textContent = 'Фото: ' + (e.message || String(e)); }
    finally { isSending = false; sendBtn.disabled = false; attachBtn.disabled = false; inputEl.focus(); }
  }

  function addMessage(name, text, isSelf, createdAt, imageUrl) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isSelf ? 'self' : 'other');
    const time = createdAt ? new Date(createdAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const nameHtml = !isSelf ? `<div class="name">${escapeHtml(name)}</div>` : '';
    const textHtml = text ? escapeHtml(text) : '';
    const imgHtml = imageUrl ? `<img src="${escapeHtml(imageUrl)}" alt="фото" loading="lazy">` : '';
    div.innerHTML = `${nameHtml}${textHtml}${imgHtml}<span class="time">${time}</span>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]);
  }

  let settingsOverlay = null;
  settingsBtn.addEventListener('click', () => {
    if (settingsOverlay) return;
    settingsOverlay = document.createElement('div');
    settingsOverlay.id = 'settings-overlay';
    settingsOverlay.innerHTML = `
      <div id="settings-panel">
        <h3>⚙️ Настройки</h3>
        <div class="setting-row"><label>Звук</label><button class="toggle ${settings.sound ? 'on' : ''}" id="toggle-sound"></button></div>
        <div class="setting-row"><label>Цвет</label>
          <div class="colors">
            <button style="background:#2aabee" data-color="#2aabee" class="${settings.accent==='#2aabee'?'active':''}"></button>
            <button style="background:#e74c3c" data-color="#e74c3c" class="${settings.accent==='#e74c3c'?'active':''}"></button>
            <button style="background:#2ecc71" data-color="#2ecc71" class="${settings.accent==='#2ecc71'?'active':''}"></button>
            <button style="background:#9b59b6" data-color="#9b59b6" class="${settings.accent==='#9b59b6'?'active':''}"></button>
            <button style="background:#f39c12" data-color="#f39c12" class="${settings.accent==='#f39c12'?'active':''}"></button>
          </div>
        </div>
        <button id="settings-close">Закрыть</button>
      </div>`;
    document.body.appendChild(settingsOverlay);
    settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) closeSettings(); });
    document.getElementById('settings-close').addEventListener('click', closeSettings);
    document.getElementById('toggle-sound').addEventListener('click', (e) => {
      settings.sound = !settings.sound;
      localStorage.setItem('chat_sound', settings.sound ? 'on' : 'off');
      e.target.classList.toggle('on', settings.sound);
      if (settings.sound) playPing();
    });
    settingsOverlay.querySelectorAll('.colors button').forEach(btn => {
      btn.addEventListener('click', () => {
        settings.accent = btn.dataset.color;
        localStorage.setItem('chat_accent', settings.accent);
        document.documentElement.style.setProperty('--accent', settings.accent);
        settingsOverlay.querySelectorAll('.colors button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  });
  function closeSettings() { if (settingsOverlay) { settingsOverlay.remove(); settingsOverlay = null; } }
</script>
</body>
 </html>

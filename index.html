<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Ural Messenger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2aabee">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--accent:#2aabee;--bg-app:#17212b;--bg-header:#1c2733;--bg-input:#242f3d;--bg-input-focus:#2b3a4a;--bg-msg-other:#182533;--bg-msg-self:#2b5278;--bg-card:#1c2733;--text:#f5f5f5;--text-muted:#7d8b99;--text-msg-other:#e1e1e1;--text-msg-self:#fff;--border:#101921;--name-color:#6ab3f3;--scroll-thumb:#2b3a4a;--online:#2ecc71}
  [data-theme="light"]{--bg-app:#fff;--bg-header:#f0f2f5;--bg-input:#f0f2f5;--bg-input-focus:#e4e6eb;--bg-msg-other:#f0f2f5;--bg-msg-self:#dcf8c6;--bg-card:#fff;--text:#111;--text-muted:#707579;--text-msg-other:#111;--text-msg-self:#111;--border:#e4e6eb;--name-color:#2aabee;--scroll-thumb:#c4c9cc}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-app);transition:background .3s}
  #app{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--bg-app);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.5)}
  @media(min-width:481px){#app{top:20px;bottom:20px;border-radius:12px}}
  .icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .hidden{display:none!important}
  @keyframes screenIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
  @keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
  .screen-anim{animation:screenIn .28s cubic-bezier(.21,1.02,.73,1)}
  #auth-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:30px;overflow-y:auto}
  #auth-screen .logo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#229ed9);display:flex;align-items:center;justify-content:center;color:#fff;animation:popIn .4s}
  #auth-screen .logo .icon{width:40px;height:40px}
  #auth-screen h2{color:var(--text);font-weight:500;font-size:20px}
  #auth-screen input{width:100%;max-width:280px;padding:12px 18px;border:1px solid var(--bg-input);border-radius:24px;background:var(--bg-input);color:var(--text);font-size:15px;outline:none;text-align:center;transition:.2s}
  #auth-screen input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(42,171,238,.15)}
  .auth-tabs{display:flex;gap:8px}
  .auth-tab{padding:8px 20px;border-radius:20px;background:var(--bg-input);color:var(--text-muted);font-size:14px;cursor:pointer;border:none;transition:.2s}
  .auth-tab.active{background:var(--accent);color:#fff}
  .auth-form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px}
  .auth-form button{padding:12px 40px;border:none;border-radius:24px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  #auth-error{color:#e74c3c;font-size:13px;min-height:18px;text-align:center}
  #list-screen{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
  #list-header{padding:14px 18px;background:var(--bg-header);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
  .avatar{border-radius:50%;background:linear-gradient(135deg,var(--accent),#229ed9);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:600;flex-shrink:0;overflow:hidden;position:relative}
  .avatar img{width:100%;height:100%;object-fit:cover}
  #list-header .avatar{width:38px;height:38px}
  #list-header .info{flex:1;min-width:0;color:var(--text)}
  #list-header .info .name{font-weight:600;font-size:15px}
  #list-header .info .status{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:4px}
  .online-dot{width:8px;height:8px;border-radius:50%;background:var(--online);display:inline-block}
  .icon-btn{background:none;border:none;color:var(--text-muted);padding:6px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
  .icon-btn:hover{background:var(--bg-input);color:var(--text)}
  #search-bar{padding:8px 18px;background:var(--bg-header);border-bottom:1px solid var(--border)}
  #search-bar input{width:100%;padding:9px 14px;border:none;border-radius:18px;background:var(--bg-input);color:var(--text);font-size:14px;outline:none}
  #chats{flex:1 1 0;min-height:0;overflow-y:auto}
  .chat-item{padding:12px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid var(--border);transition:.15s;position:relative;user-select:none}
  .chat-item:hover{background:var(--bg-input)}
  .chat-item .chat-avatar{width:46px;height:46px}
  .chat-item .chat-info{flex:1;min-width:0}
  .chat-item .chat-name{color:var(--text);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .chat-item .chat-sub{color:var(--text-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--accent);color:#fff;font-weight:600}
  .badge.pending{background:#f39c12}
  #list-empty{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:14px}
  #chat-screen{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
  #header{padding:12px 14px;background:var(--bg-header);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
  #back-btn{background:none;border:none;color:var(--text-muted);padding:6px;border-radius:50%;cursor:pointer;display:flex}
  #header .avatar{width:36px;height:36px}
  #header .info{color:var(--text);flex:1;min-width:0}
  #header .info .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #header .info .status{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:4px}
  #call-btn{color:var(--accent)!important;background:rgba(42,171,238,.12)}
  #messages{flex:1 1 0;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
  .msg{max-width:80%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.4;word-break:break-word;flex-shrink:0;animation:msgIn .35s forwards;opacity:0;transform:translateY(12px)}
  .msg.self{align-self:flex-end;background:var(--bg-msg-self);color:var(--text-msg-self);border-bottom-right-radius:4px}
  .msg.other{align-self:flex-start;background:var(--bg-msg-other);color:var(--text-msg-other);border-bottom-left-radius:4px}
  .msg .name{font-size:11px;font-weight:600;color:var(--name-color);margin-bottom:2px;display:flex;align-items:center;gap:6px}
  .msg .time{font-size:10px;color:var(--text-muted);float:right;margin-left:8px;margin-top:4px}
  .msg .time .check{font-size:11px;margin-left:4px;color:var(--text-muted)}
  .msg .time .check.read{color:var(--accent)}
  .msg img{max-width:100%;border-radius:8px;margin-top:6px;display:block}
  #input-area{padding:12px 16px;background:var(--bg-header);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  #attach{width:38px;height:38px;border:none;border-radius:50%;background:var(--bg-input);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
  #input{flex:1;padding:10px 16px;border:none;border-radius:20px;background:var(--bg-input);color:var(--text);font-size:14px;outline:none;min-width:0}
  #send{width:42px;height:42px;border:none;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #send:disabled{background:var(--bg-input-focus);color:var(--text-muted)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;z-index:100;animation:fadeIn .2s;padding:20px}
  .panel{background:var(--bg-card);border-radius:16px;padding:24px;width:100%;max-width:360px;color:var(--text);animation:popIn .25s;max-height:90vh;overflow-y:auto}
  .panel h3{margin-bottom:16px;font-weight:600}
  .panel input,.panel textarea,.panel select{width:100%;padding:12px 16px;border:none;border-radius:12px;background:var(--bg-input);color:var(--text);font-size:14px;outline:none;margin-bottom:10px;resize:none}
  .panel .btn-primary{width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
  .panel .btn-secondary{width:100%;padding:12px;border:none;border-radius:12px;background:var(--bg-input);color:var(--text);font-size:14px;cursor:pointer;margin-top:8px}
  .panel .err{color:#e74c3c;font-size:13px;min-height:18px}
  .panel .check{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0 12px;cursor:pointer}
  .panel .check input{width:auto;margin:0}
  .setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bg-input)}
  .toggle{width:46px;height:26px;border-radius:13px;background:var(--bg-input-focus);border:none;cursor:pointer;position:relative;transition:.25s}
  .toggle.on{background:var(--accent)}
  .toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
  .toggle.on::after{transform:translateX(20px)}
  .themes{display:flex;gap:8px;flex-wrap:wrap}
  .themes button{width:36px;height:36px;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden}
  .themes button::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--preview-bg) 50%,var(--preview-accent) 50%)}
  .themes button.active{border-color:var(--accent)}
  .menu-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .menu-item{padding:14px;border-radius:12px;background:var(--bg-input);color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;gap:12px}
  .settings-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:12px}
  .settings-avatar{width:80px;height:80px;font-size:28px;cursor:pointer}
  .search-section-title{padding:10px 18px 6px;font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:700}
  #call-overlay{z-index:200}
  #call-overlay .panel{text-align:center}
  #call-avatar-wrap{display:flex;justify-content:center;margin-bottom:12px}
  #call-avatar-wrap .avatar{width:90px;height:90px;font-size:34px}
  #call-timer{font-size:32px;font-weight:600;margin:16px 0}
  .call-buttons{display:flex;gap:12px;justify-content:center;margin-top:16px}
  .call-btn{width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .call-btn.accept{background:#2ecc71;color:#fff}
  .call-btn.decline{background:#e74c3c;color:#fff}
  .call-btn.hangup{background:#e74c3c;color:#fff}
  .call-btn .icon{width:26px;height:26px}
  .schedule-item{padding:10px 0;border-bottom:1px solid var(--border)}
  .schedule-item .head{display:flex;justify-content:space-between;margin-bottom:4px}
  .schedule-item .type{font-weight:600;color:var(--accent);font-size:13px}
  .schedule-item .date{font-size:10px;color:var(--text-muted)}
  .schedule-item .body{font-size:14px;white-space:pre-wrap}
  .schedule-item img{max-width:100%;border-radius:8px;margin-top:6px}
  #typing-indicator{padding:0 16px 4px;font-size:11px;color:var(--text-muted);height:16px}
  #request-panel{padding:16px;background:var(--bg-header);border-bottom:1px solid var(--border);text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="auth-screen">
    <div class="logo"><svg class="icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
    <h2>Ural Messenger</h2>
    <div class="auth-tabs"><button class="auth-tab active" id="tab-login">Войти</button><button class="auth-tab" id="tab-create">Регистрация</button></div>
    <div class="auth-form" id="form-login"><input type="tel" id="login-phone" placeholder="+7 XXX XXX-XX-XX" maxlength="18"><input type="password" id="login-password" placeholder="Пароль" maxlength="50"><button id="login-btn">Войти</button></div>
    <div class="auth-form hidden" id="form-create"><input type="text" id="create-name" placeholder="Имя" maxlength="20"><input type="tel" id="create-phone" placeholder="+7 XXX XXX-XX-XX" maxlength="18"><input type="password" id="create-password" placeholder="Пароль" maxlength="50"><button id="create-btn">Создать</button></div>
    <div id="auth-error"></div>
  </div>
  <div id="list-screen" class="hidden">
    <div id="list-header">
      <div class="avatar" id="me-avatar">?</div>
      <div class="info"><div class="name" id="me-name">Пользователь</div><div class="status" id="me-status"><span class="online-dot"></span> онлайн</div></div>
      <button class="icon-btn hidden" id="install-btn" title="Установить"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2v13m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
      <button class="icon-btn" id="schedule-btn" title="Расписание"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button>
      <button class="icon-btn" id="settings-btn" title="Настройки"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button class="icon-btn" id="new-chat-btn" title="Новый чат"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div id="search-bar"><input type="text" id="search-input" placeholder="Поиск групп и людей..."></div>
    <div id="chats"></div>
  </div>
  <div id="chat-screen" class="hidden">
    <div id="header">
      <button id="back-btn"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
      <div class="avatar" id="chat-avatar">?</div>
      <div class="info"><div class="name" id="chat-title">Чат</div><div class="status" id="chat-status">Подключение...</div></div>
      <button class="icon-btn hidden" id="call-btn"><svg class="icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
      <button class="icon-btn hidden" id="group-settings-btn"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div id="typing-indicator"></div>
    <div id="messages"></div>
    <div id="input-area">
      <button id="attach"><svg class="icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
      <input type="file" id="file-input" accept="image/*" hidden>
      <input type="text" id="input" placeholder="Написать сообщение..." disabled>
      <button id="send" disabled><svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>
</div>
<div id="call-overlay" class="overlay hidden"><div class="panel">
  <div id="call-avatar-wrap"><div class="avatar" id="call-avatar">?</div></div>
  <h3 id="call-title">Звонок</h3>
  <div id="call-status" style="color:var(--text-muted);margin-bottom:8px;">Соединение...</div>
  <div id="call-timer" style="display:none;">00:00</div>
  <div class="call-buttons">

  $('chat-screen').classList.add('hidden');$('list-screen').classList.remove('hidden');$('list-screen').classList.add('screen-anim');

async function sendMessage(){
  const text=$('input').value.trim();
  if(!text||isSending||!currentChatId)return;
  if(hasBadWord(text)){$('chat-status').textContent='Сообщение содержит запрещённые слова';return}
  const{data:cd}=await supabase.from('chats').select('status').eq('id',currentChatId).single();
  if(cd&&cd.status==='pending'){$('chat-status').textContent='Чат не подтверждён';return}
  isSending=true;$('send').disabled=true;$('input').value='';
  const{error}=await supabase.from('messages').insert({user_name:myName,text,image_url:null,chat_id:currentChatId,read_by:[myPhone]});
  if(error){$('chat-status').textContent='Ошибка: '+error.message;$('input').value=text}
  isSending=false;$('send').disabled=false;$('input').focus();
}

async function handleFileUpload(){
  const fi=$('file-input'),file=fi.files[0];fi.value='';
  if(!file||isSending||!currentChatId)return;
  if(!file.type.startsWith('image/')){$('chat-status').textContent='Не фото';return}
  if(file.size>5*1024*1024){$('chat-status').textContent='>5 МБ';return}
  isSending=true;$('send').disabled=true;$('chat-status').textContent='Загрузка...';
  try{
    const ext=file.name.split('.').pop()||'jpg',path=`${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
    const{error:up}=await supabase.storage.from('chat-images').upload(path,file,{contentType:file.type,cacheControl:'3600'});
    if(up){$('chat-status').textContent='Фото: '+up.message;return}
    const{data:urlData}=supabase.storage.from('chat-images').getPublicUrl(path);
    const{error:ins}=await supabase.from('messages').insert({user_name:myName,text:'',image_url:urlData.publicUrl,chat_id:currentChatId,read_by:[myPhone]});
    if(ins)$('chat-status').textContent='Фото: '+ins.message;
  }finally{isSending=false;$('send').disabled=false;$('input').focus()}
}

function addMessage(name,text,isSelf,createdAt,imageUrl,readBy){
  const div=document.createElement('div');
  div.className='msg '+(isSelf?'self':'other');
  const time=createdAt?new Date(createdAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
  const displayName=myLocalNames[name]||name;
  const nameHtml=!isSelf?`<div class="name">${escapeHtml(displayName)}</div>`:'';
  let checkHtml='';
  if(isSelf){
    const isRead=readBy&&readBy.length>0&&readBy.some(p=>p!==myPhone);
    checkHtml=`<span class="check ${isRead?'read':''}">${isRead?'✓✓':'✓'}</span>`;
  }
  div.innerHTML=`${nameHtml}${text?escapeHtml(text):''}${imageUrl?`<img src="${escapeHtml(imageUrl)}" loading="lazy">`:''}<span class="time">${time}${checkHtml}</span>`;
  $('messages').appendChild(div);$('messages').scrollTop=$('messages').scrollHeight;
}

function callFmt(s){return`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`}
function startTimer(){callStartTime=Date.now();$('call-timer').style.display='block';callTimerInterval=setInterval(()=>{$('call-timer').textContent=callFmt(Math.floor((Date.now()-callStartTime)/1000))},1000)}
function stopTimer(){if(callTimerInterval)clearInterval(callTimerInterval);callTimerInterval=null;$('call-timer').style.display='none';$('call-timer').textContent='00:00'}

function resetCallUI(){callOverlay.classList.add('hidden');$('call-accept').style.display='none';$('call-hangup').style.display='none';$('call-decline').style.display='none';stopTimer();isCallActive=false}

async function cleanupCall(){
  if(pc){pc.ontrack=null;pc.onicecandidate=null;pc.onconnectionstatechange=null;pc.close();pc=null}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
  if(callChannel){supabase.removeChannel(callChannel);callChannel=null}
  remoteAudio.srcObject=null;resetCallUI();
}

async function setupPeer(){
  pc=new RTCPeerConnection(ICE);
  pc.ontrack=e=>{remoteAudio.srcObject=e.streams[0]};
  pc.onicecandidate=e=>{if(e.candidate&&callChannel)callChannel.send({type:'broadcast',event:'ice',payload:{candidate:e.candidate}})};
  pc.onconnectionstatechange=()=>{
    if(!pc)return;
    if(pc.connectionState==='connected'){$('call-status').textContent='Соединено';if(!callStartTime)startTimer()}
    else if(pc.connectionState==='disconnected'||pc.connectionState==='failed'){$('call-status').textContent='Связь потеряна';setTimeout(cleanupCall,1500)}
  };
  try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));return true}
  catch(e){$('call-status').textContent='Нет микрофона';setTimeout(cleanupCall,2000);return false}
}

async function startCall(){
  if(isCallActive||!currentChatId||currentChatType!=='direct')return;
  isCallActive=true;
  callOverlay.classList.remove('hidden');
  $('call-title').textContent=$('chat-title').textContent;
  $('call-avatar').outerHTML=avatarHtml($('chat-title').textContent,'',90).replace('class="avatar"','class="avatar" id="call-avatar"');
  $('call-status').textContent='Вызов...';
  $('call-accept').style.display='none';$('call-hangup').style.display='flex';$('call-decline').style.display='none';

  const ok=await setupPeer();if(!ok)return;
  const peer=currentChatPeer;if(!peer){$('call-status').textContent='Нет собеседника';setTimeout(cleanupCall,1500);return}

  callChannel=supabase.channel('user-'+peer,{config:{broadcast:{self:false}}});
  callChannel
    .on('broadcast',{event:'answer'},async({payload})=>{if(pc&&payload.sdp){await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));$('call-status').textContent='Соединение...'}})
    .on('broadcast',{event:'ice'},async({payload})=>{if(pc&&payload.candidate){try{await pc.addIceCandidate(new RTCIceCandidate(payload.candidate))}catch(e){}}})
    .on('broadcast',{event:'decline'},()=>{$('call-status').textContent='Отклонён';setTimeout(cleanupCall,1200)})
    .on('broadcast',{event:'hangup'},()=>{$('call-status').textContent='Завершён';setTimeout(cleanupCall,800)})
    .subscribe(async st=>{
      if(st==='SUBSCRIBED'){
        const offer=await pc.createOffer();await pc.setLocalDescription(offer);
        callChannel.send({type:'broadcast',event:'incoming-call',payload:{to:peer,from:myName,fromPhone:myPhone,sdp:offer,chatId:currentChatId}});
      }
    });
}

function setupGlobalCallListener(){
  if(window._globalCallChannel)supabase.removeChannel(window._globalCallChannel);
  window._globalCallChannel=supabase.channel('user-'+myPhone,{config:{broadcast:{self:false}}});
  window._globalCallChannel
    .on('broadcast',{event:'incoming-call'},async({payload})=>{
      if(isCallActive||payload.to!==myPhone)return;
      window._pendingOffer=payload.sdp;window._incomingFrom=payload.from;window._incomingFromPhone=payload.fromPhone;
      callChannel=window._globalCallChannel;
      isCallActive=true;callOverlay.classList.remove('hidden');
      $('call-title').textContent=payload.from;
      $('call-avatar').outerHTML=avatarHtml(payload.from,'',90).replace('class="avatar"','class="avatar" id="call-avatar"');
      $('call-status').textContent='Входящий звонок...';
      $('call-accept').style.display='flex';$('call-decline').style.display='flex';$('call-hangup').style.display='none';
      if(settings.sound){playPing();setTimeout(playPing,400)}
    })
    .on('broadcast',{event:'ice'},async({payload})=>{if(pc&&payload.candidate){try{await pc.addIceCandidate(new RTCIceCandidate(payload.candidate))}catch(e){}}})
    .subscribe();
}

$('call-accept').onclick=async()=>{
  $('call-accept').style.display='none';$('call-decline').style.display='none';$('call-hangup').style.display='flex';
  $('call-status').textContent='Соединение...';
  const ok=await setupPeer();if(!ok)return;
  if(window._pendingOffer){await pc.setRemoteDescription(new RTCSessionDescription(window._pendingOffer));const ans=await pc.createAnswer();await pc.setLocalDescription(ans);callChannel.send({type:'broadcast',event:'answer',payload:{sdp:ans}});window._pendingOffer=null}
};
$('call-decline').onclick=()=>{if(callChannel)callChannel.send({type:'broadcast',event:'decline',payload:{}});cleanupCall()};
$('call-hangup').onclick=()=>{if(callChannel)callChannel.send({type:'broadcast',event:'hangup',payload:{}});cleanupCall()};

const installBtn=document.getElementById('install-btn');
let deferredPrompt=null;
function isAppInstalled(){
  try{
    if(window.matchMedia('(display-mode: standalone)').matches)return true;
    if(window.navigator.standalone===true)return true;
    if(document.referrer.includes('android-app://'))return true;
  }catch(e){}
  return false;
}
function hideInstallButton(){
  if(installBtn&&installBtn.parentNode)installBtn.parentNode.removeChild(installBtn);
  try{localStorage.setItem('pwa_installed','true')}catch(e){}
}
if(isAppInstalled()||localStorage.getItem('pwa_installed')==='true')hideInstallButton();
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  if(installBtn&&!isAppInstalled())installBtn.classList.remove('hidden');
});
if(installBtn)installBtn.addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  try{await deferredPrompt.userChoice}catch(e){}
  deferredPrompt=null;
});
window.addEventListener('appinstalled',hideInstallButton);

if('serviceWorker'in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;window.location.reload();});
  setInterval(()=>{navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})},5*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('/Ural-Messenger/sw.js',{scope:'/Ural-Messenger/'}).catch(()=>{})});
}

const SECRET_WORD='uraladmin';
const searchEl=document.getElementById('search-input');
if(searchEl){
  searchEl.addEventListener('input',e=>{if(e.target.value.trim().toLowerCase()===SECRET_WORD){e.target.value='';openAdminConsole();}});
  searchEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim().toLowerCase()===SECRET_WORD){e.preventDefault();e.target.value='';openAdminConsole();}});
}
function addAdminButton(){
  if(myPhone!==ADMIN_PHONE)return;
  if(document.getElementById('admin-btn'))return;
  const header=document.getElementById('list-header');
  if(!header)return;
  const btn=document.createElement('button');
  btn.id='admin-btn';btn.className='icon-btn';btn.title='Админ';
  btn.innerHTML='<svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></svg>';
  btn.style.color='#f39c12';
  btn.onclick=openAdminConsole;
  header.insertBefore(btn,header.querySelector('#settings-btn')||header.lastElementChild);
}
async function openAdminConsole(){
  if(myPhone!==ADMIN_PHONE)return;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="panel" style="max-height:85vh;overflow-y:auto;"><h3>🛠 Админ-консоль</h3><div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Всего: <span id="adm-count">...</span></div><div id="adm-list" style="max-height:400px;overflow-y:auto;"></div><button class="btn-secondary" id="adm-clean" style="color:#e74c3c;margin-top:10px;">Удалить всех, кроме меня</button><button class="btn-secondary" id="adm-close">Закрыть</button></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  document.getElementById('adm-close').onclick=()=>ov.remove();
  const{data:users}=await supabase.from('users_public').select('name,phone');
  document.getElementById('adm-count').textContent=users?users.length:0;
  const list=document.getElementById('adm-list');list.innerHTML='';
  (users||[]).forEach(u=>{
    const div=document.createElement('div');
    div.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;';
    div.innerHTML=`<span>${escapeHtml(u.name)} <small style="color:var(--text-muted)">${escapeHtml(u.phone)}</small></span>${u.phone!==ADMIN_PHONE?`<button style="background:none;border:none;color:#e74c3c;cursor:pointer;font-size:16px;" data-del="${u.phone}">✕</button>`:'<span style="color:var(--online);font-size:11px;">вы</span>'}`;
    list.appendChild(div);
  });
  list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Удалить '+b.dataset.del+'?'))return;
    await supabase.from('chat_members').delete().eq('user_phone',b.dataset.del);
    await supabase.from('local_names').delete().eq('owner_phone',b.dataset.del);
    await supabase.from('users').delete().eq('phone',b.dataset.del);
    ov.remove();openAdminConsole();
  });
  document.getElementById('adm-clean').onclick=async()=>{
    if(!confirm('Удалить всех, кроме вас?'))return;
    const{data:all}=await supabase.from('users_public').select('phone');
    (all||[]).forEach(async u=>{
      if(u.phone===ADMIN_PHONE)return;
      await supabase.from('chat_members').delete().eq('user_phone',u.phone);
      await supabase.from('local_names').delete().eq('owner_phone',u.phone);
      await supabase.from('users').delete().eq('phone',u.phone);
    });
    await supabase.from('chats').delete().eq('type','direct');
    ov.remove();alert('Готово');location.reload();
  };
}
</script>
